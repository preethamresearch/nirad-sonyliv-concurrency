# LibreChat configuration -- committed as submission evidence (no keys here;
# GOOGLE_KEY and friends arrive via environment, see edge-compose.yml).
#
# The chat flow the brief asks for ("optionally, ask a follow-up question in
# chat") is Gemini + the MCP tools below. The tools are the SAME verified
# queries the dashboard runs -- the model is not free to invent SQL against
# raw tables; it calls tools whose answers are oracle-verified, and it is
# told to report a failed query as a failure rather than estimate.
version: 1.2.1
cache: true

interface:
  customWelcome: >-
    Ask about SonyLIV concurrency: peaks, filters (platform, country,
    video type), the naive-vs-foreground gap, or session behaviour.
    Every number comes from a verified ClickHouse query, never from memory.

# LibreChat blocks private-network MCP targets by default (SSRF guard).
# Our MCP server IS on the private compose network -- that is the design --
# so it is exempted explicitly by host:port rather than by disabling the
# guard.
mcpSettings:
  allowedDomains:
    - "mcp.internal"
  allowedAddresses:
    - "mcp.internal:8765"

mcpServers:
  watchhouse:
    type: streamable-http
    url: http://mcp.internal:8765/mcp/
    timeout: 60000
    # Surface the server as a selectable chip in the chat input, so grounding
    # is one click in a plain chat rather than buried in the agent builder.
    chatMenu: true
    serverInstructions: >-
      Tools return JSON from oracle-verified ClickHouse queries over the
      judged dataset. If a tool returns an error, say the query failed --
      do not estimate or invent a number.

endpoints:
  google:
    models:
      default: ["gemini-3.1-flash-lite", "gemini-3.1-flash", "gemini-3.1-pro"]
    titleConvo: true
    titleModel: "gemini-3.1-flash-lite"
  custom:
    # The demo endpoint: same Gemini models, but through LiteLLM so every
    # generation lands in Langfuse with REAL token usage, cost and latency.
    # Pick "Gemini · traced" in the endpoint menu to use it.
    - name: "Gemini · traced"
      baseURL: "http://litellm.internal:4000/v1"
      apiKey: "${LITELLM_MASTER_KEY}"
      models:
        default: ["gemini-3.1-flash-lite", "gemini-3.1-flash", "gemini-3.1-pro"]
        fetch: false
      titleConvo: true
      titleModel: "gemini-3.1-flash-lite"
      modelDisplayLabel: "Gemini via LiteLLM"
