/* ---------------------------------------------------------------------
   Live pipeline. Polls while the tab is open; stops when you leave it.
   Each component reports independently, so a dead dependency shows as one
   red panel rather than a blank page -- during an incident the useful
   information is WHICH part stopped.
   --------------------------------------------------------------------- */
/* ---------------------------------------------------------------------
   Animated pipeline flow. Pure SVG + CSS -- no three.js, no CDN.
   The motion is DATA, not decoration: particle rate on each edge is scaled
   from the live counters, so a stalled consumer visibly stops moving and a
   DLQ spike visibly thickens the reject path. An animation that looks the
   same whether the pipeline is healthy or dead is worse than none.
   --------------------------------------------------------------------- */
const FLOW_NODES = [
  {id:"src",  x:  40, y:104, w:104, h:44, label:"Producers",  sub:"player events"},
  {id:"kafka",x: 196, y:104, w:112, h:44, label:"Kafka",      sub:"6 partitions"},
  {id:"val",  x: 360, y:104, w:112, h:44, label:"Validator",  sub:"contract"},
  {id:"dedup",x: 524, y:104, w:112, h:44, label:"Dedup",      sub:"Redis SETNX"},
  {id:"ch",   x: 688, y:104, w:120, h:44, label:"ClickHouse", sub:"batched"},
  {id:"dlq",  x: 360, y:196, w:112, h:40, label:"DLQ",        sub:"quarantine"},
  {id:"redis",x: 524, y: 24, w:112, h:40, label:"Redis",      sub:"session state"},
];
const FLOW_EDGES = [
  {from:"src",  to:"kafka", key:"in"},
  {from:"kafka",to:"val",   key:"in"},
  {from:"val",  to:"dedup", key:"ok"},
  {from:"dedup",to:"ch",    key:"ok"},
  {from:"val",  to:"dlq",   key:"dlq",   drop:true},
  {from:"dedup",to:"redis", key:"state", up:true},
];

function edgePath(a, b, opt) {
  const ax = a.x + a.w, ay = a.y + a.h / 2;
  const bx = b.x,       by = b.y + b.h / 2;
  if (opt && (opt.drop || opt.up)) {
    const mx = a.x + a.w / 2;
    return `M ${mx} ${opt.drop ? a.y + a.h : a.y} V ${opt.drop ? by : by + b.h} `
         + `H ${b.x + b.w / 2}`;
  }
  const mid = (ax + bx) / 2;
  return `M ${ax} ${ay} C ${mid} ${ay}, ${mid} ${by}, ${bx} ${by}`;
}

function renderFlow(host, rates) {
  const W = 840, H = 264;
  const byId = Object.fromEntries(FLOW_NODES.map(n => [n.id, n]));
  const defs = FLOW_EDGES.map((e, i) => {
    const opt = {drop: e.drop, up: e.up};
    return `<path id="fp${i}" d="${edgePath(byId[e.from], byId[e.to], opt)}" fill="none"/>`;
  }).join("");

  const wires = FLOW_EDGES.map((e, i) => {
    const stroke = e.drop ? "var(--crit)" : e.key === "state" ? "var(--s3)" : "var(--s1)";
    const rate = Math.max(0, rates[e.key] || 0);
    const dur = rate <= 0 ? 0 : Math.max(0.55, 3.2 - Math.min(rate, 1) * 2.5);
    const dots = rate <= 0 ? "" : Array.from({length: 3}, (_, k) => `
      <circle r="3.2" fill="${stroke}">
        <animateMotion dur="${dur}s" repeatCount="indefinite"
          begin="${(dur / 3 * k).toFixed(2)}s">
          <mpath href="#fp${i}"/></animateMotion></circle>`).join("");
    return `<use href="#fp${i}" stroke="${stroke}" stroke-opacity=".28"
              stroke-width="${e.drop ? 1.5 : 2}"
              ${e.drop ? 'stroke-dasharray="4 4"' : ""}/>${dots}`;
  }).join("");

  const boxes = FLOW_NODES.map(n => `
    <g>
      <rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8"
            fill="var(--surface-2)" stroke="var(--line)"/>
      <text x="${n.x + n.w/2}" y="${n.y + n.h/2 - 2}" text-anchor="middle"
            font-size="12" font-weight="620" fill="var(--ink-1)">${esc(n.label)}</text>
      <text x="${n.x + n.w/2}" y="${n.y + n.h/2 + 13}" text-anchor="middle"
            font-size="10" fill="var(--ink-3)">${esc(n.sub)}</text>
    </g>`).join("");

  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="pipeline flow, particle rate scaled to live throughput">
    <defs>${defs}</defs>${wires}${boxes}</svg>
    <p class="note-inline">Particle rate is scaled from the live counters — if the
      consumer stalls the flow stops moving. Idle edges are drawn without particles
      rather than animating a pipeline that is not running.</p>`;
}

/* Count-up on stat values. Short, eased, and skipped for non-numerics so it
   never mangles a label. */
function countUp(el, to, fmtFn) {
  const f = fmtFn || fmt;
  if (to == null || !isFinite(to)) { el.textContent = to == null ? "—" : to; return; }
  // Write the real value FIRST. requestAnimationFrame is paused in a
  // background tab, so an animation-only path leaves the tile showing its
  // placeholder forever -- which is what an operator sees after switching
  // away and back during a live event.
  el.textContent = f(to);
  if (document.hidden) return;
  const from = parseFloat((el.dataset.v || "0")) || 0;
  el.dataset.v = String(to);
  if (from === to) return;
  const t0 = performance.now(), dur = 420;
  function step(now) {
    const p = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    el.textContent = f(Math.round(from + (to - from) * e));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* =========================================================================
   Ingestion monitor: source → lanes → sink, with batch bars, alerts, logs.
   The lanes are the real pipeline stages and the dot rate is scaled from
   measured row counts, so a stalled stage visibly stops. An animation that
   looks identical whether the pipeline is healthy or dead is worse than none.
   ========================================================================= */
function chartLanes(host, lanes, endpoint) {
  // Explicit column geometry. The previous version right-anchored the lane
  // labels into the space the source box already occupied, and gave the
  // animated dots no initial cx -- so they defaulted to x=0 and sat in a
  // stack outside the diagram until their animation began.
  const SRC_X = 8,  SRC_W = 132;          // source box
  const LBL_X = SRC_X + SRC_W + 18;       // labels start here, left-aligned
  const LBL_W = 132;
  const LANE_X = LBL_X + LBL_W + 14;      // lane track
  const LANE_W = 430;
  const VAL_X = LANE_X + LANE_W + 18;     // counts
  const W = VAL_X + 190, laneH = 40, top = 14;
  const H = top + lanes.length * laneH + 10;
  const maxRows = Math.max(1, ...lanes.map(l => l.rows));

  const wires = lanes.map((l, i) => {
    const y = top + i * laneH + laneH / 2;
    const frac = l.rows / maxRows;
    const dur = l.rows <= 0 ? 0 : Math.max(1.2, 4.2 - frac * 3.0);
    const dots = l.rows <= 0 ? "" : Array.from({length: 4}, (_, k) =>
      '<circle cx="' + LANE_X + '" cy="' + y + '" r="3.4" fill="var(--s1)">' +
        '<animate attributeName="cx" from="' + LANE_X + '" to="' + (LANE_X + LANE_W) +
        '" dur="' + dur + 's" repeatCount="indefinite" begin="' +
        (dur / 4 * k).toFixed(2) + 's"/></circle>').join("");
    return '<g>' +
      '<text x="' + LBL_X + '" y="' + (y + 4) + '" font-size="12" ' +
        'font-family="ui-monospace,monospace" fill="var(--ink-2)">' + esc(l.label) + '</text>' +
      '<rect x="' + LANE_X + '" y="' + (y - 7) + '" width="' + LANE_W + '" height="14" rx="7" ' +
        'fill="var(--surface-2)" stroke="var(--line)"/>' +
      dots +
      '<text x="' + VAL_X + '" y="' + (y - 1) + '" font-size="12.5" ' +
        'font-variant-numeric="tabular-nums" fill="var(--ink-1)" font-weight="640">' +
        fmt(l.rows) + '</text>' +
      '<text x="' + VAL_X + '" y="' + (y + 13) + '" font-size="10" ' +
        'fill="var(--ink-3)">' + esc(l.size) + ' · ' + l.parts + ' parts</text>' +
    '</g>';
  }).join("");

  const boxH = lanes.length * laneH - 14;
  const boxY = top + 7;
  host.innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      '<rect x="' + SRC_X + '" y="' + boxY + '" width="' + SRC_W + '" height="' + boxH +
        '" rx="9" fill="var(--surface-2)" stroke="var(--line)"/>' +
      '<text x="' + (SRC_X + SRC_W / 2) + '" y="' + (boxY + boxH / 2 - 2) +
        '" text-anchor="middle" font-size="12" font-weight="640" ' +
        'fill="var(--ink-1)">Event stream</text>' +
      '<text x="' + (SRC_X + SRC_W / 2) + '" y="' + (boxY + boxH / 2 + 14) +
        '" text-anchor="middle" font-size="10" fill="var(--ink-3)">Kafka · 6 partitions</text>' +
      wires +
    '</svg>' +
    '<p class="note-inline">Each lane is a real stage; dot rate scales with rows held. ' +
      'Destination <code>' + esc(endpoint) + '</code></p>';
}

/* Batch bars: one bar per active part, i.e. one insert batch. */
function chartBatches(host, batches) {
  if (!batches.length) { host.innerHTML = '<p class="empty">no recent batches</p>'; return; }
  const W = host.clientWidth || 900, H = 120;
  const max = Math.max(1, ...batches.map(b => b.rows));
  const bw = W / batches.length;
  const colorOf = s => s === "raw_events" ? "--s1"
                     : s === "session_active_intervals" ? "--s3" : "--s4";
  const bars = batches.map((b, i) => {
    const h = Math.max(2, b.rows / max * (H - 26));
    return '<g class="bt" data-i="' + i + '">' +
      '<rect x="' + (i * bw + 1) + '" y="' + (H - 18 - h) + '" width="' +
        Math.max(2, bw - 3) + '" height="' + h + '" rx="2" fill="var(' + colorOf(b.stage) + ')"/>' +
      '<rect x="' + (i * bw) + '" y="0" width="' + bw + '" height="' + H +
        '" fill="transparent"/></g>';
  }).join("");
  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '">' + bars +
    '<line x1="0" x2="' + W + '" y1="' + (H - 18) + '" y2="' + (H - 18) +
    '" stroke="var(--line)"/></svg>' +
    '<p class="note-inline">Each bar is one active part — one insert batch. ' +
      'Tallest here is ' + fmt(max) + ' rows.</p>';
  host.querySelectorAll(".bt").forEach(g => {
    const b = batches[+g.dataset.i];
    g.addEventListener("pointermove", ev => showTip(ev.clientX, ev.clientY,
      '<div class="when">' + esc(b.at) + '</div>' +
      '<div class="r"><span class="k" style="background:var(' + colorOf(b.stage) + ')"></span>' +
      '<span class="v">' + fmt(b.rows) + '</span><span class="n">rows</span></div>' +
      '<div class="r"><span class="k" style="background:transparent"></span>' +
      '<span class="v">' + (b.bytes/1024).toFixed(0) + ' kB</span><span class="n">' +
      esc(b.stage) + '</span></div>'));
    g.addEventListener("pointerleave", hideTip);
  });
}

/* =========================================================================
   Log viewer with pagination and stable state across polling.

   The previous version re-rendered the whole list on every 6s poll, which
   destroyed the expanded row AND reset scrollTop -- so opening an entry and
   scrolling down was impossible: it snapped shut and jumped to the top before
   you reached the bottom. Three things fix it:

     1. Pagination, so a page is a bounded number of rows rather than the
        whole stream.
     2. A content signature -- if the data has not changed, do not touch the
        DOM at all. Polling should be invisible when nothing happened.
     3. Expanded rows are keyed by a stable id, not by index, and scrollTop is
        restored, so a refresh that DOES change data keeps your place.
   ========================================================================= */
const LOG_PAGE = 12;
const _logState = {page: 0, open: new Set(), sig: "", level: "all"};

function logKey(l) {
  return String(l.at) + "|" + l.src + "|" + (l.event || "") + "|" + (l.summary || "");
}

function renderLogs(host, logs) {
  const filtered = _logState.level === "all"
    ? logs : logs.filter(l => l.level === _logState.level);
  const sig = _logState.level + ":" + filtered.length + ":" +
              (filtered[0] ? logKey(filtered[0]) : "") + ":" + _logState.page;
  if (sig === _logState.sig && host.querySelector(".logs")) return;  // nothing changed
  _logState.sig = sig;

  const pages = Math.max(1, Math.ceil(filtered.length / LOG_PAGE));
  if (_logState.page >= pages) _logState.page = pages - 1;
  const start = _logState.page * LOG_PAGE;
  const slice = filtered.slice(start, start + LOG_PAGE);
  const prevScroll = (host.querySelector(".logs") || {}).scrollTop || 0;

  const counts = logs.reduce((a, l) => { a[l.level] = (a[l.level] || 0) + 1; return a; }, {});
  const tabs = ["all", "error", "warn", "info"].map(lv =>
    '<button class="ltab' + (_logState.level === lv ? " on" : "") + '" data-lv="' + lv + '">' +
      esc(lv) + (lv === "all" ? " " + logs.length
                              : " " + (counts[lv] || 0)) + '</button>').join("");

  host.innerHTML =
    '<div class="logbar">' + tabs + '<span class="grow"></span>' +
      '<span class="pageinfo">' + (filtered.length ? (start + 1) : 0) + '\–' +
        Math.min(start + LOG_PAGE, filtered.length) + ' of ' + filtered.length + '</span>' +
      '<button class="pg" data-d="-1"' + (_logState.page === 0 ? " disabled" : "") + '>\‹</button>' +
      '<button class="pg" data-d="1"' + (_logState.page >= pages - 1 ? " disabled" : "") + '>\›</button>' +
    '</div>' +
    '<div class="logs">' + (slice.length ? slice.map(l => {
      const k = logKey(l), open = _logState.open.has(k);
      return '<div class="logrow ' + l.level + (open ? " open" : "") + '" data-k="' + esc(k) + '">' +
        '<div class="lhead">' +
          '<span class="chev">\›</span>' +
          '<span class="ts">' + esc(String(l.at).slice(0, 19)) + '</span>' +
          '<span class="lvl">' + esc(l.level.toUpperCase()) + '</span>' +
          '<span class="src">' + esc(l.src) + '</span>' +
          '<span class="evt">' + esc(l.event || "") + '</span>' +
          '<span class="sum">' + esc(l.summary || "") + '</span>' +
          '<span class="where">' + esc(l.where || "") + '</span>' +
          '<span class="nf">' + Object.keys(l.fields || {}).length + ' fields</span>' +
        '</div>' +
        '<div class="ldetail"' + (open ? "" : " hidden") + '>' +
          '<div class="codehead"><span>record</span>' +
            '<button class="copybtn">Copy JSON</button></div>' +
          '<pre class="code">' + esc(l.raw || "{}") + '</pre>' +
        '</div></div>';
    }).join("") : '<p class="empty">no entries at this level</p>') + '</div>' +
    (pages > 1
      ? '<div class="pager"><button class="pgbtn" data-d="-1"' +
          (_logState.page === 0 ? " disabled" : "") + '>← Newer</button>' +
        '<span class="pgnum">Page ' + (_logState.page + 1) + ' of ' + pages + '</span>' +
        '<button class="pgbtn" data-d="1"' +
          (_logState.page >= pages - 1 ? " disabled" : "") + '>Older →</button></div>'
      : "");

  const box = host.querySelector(".logs");
  if (box) box.scrollTop = prevScroll;

  host.querySelectorAll(".ltab").forEach(b => b.addEventListener("click", () => {
    _logState.level = b.dataset.lv; _logState.page = 0; _logState.sig = "";
    renderLogs(host, logs);
  }));
  host.querySelectorAll(".pgbtn").forEach(b => b.addEventListener("click", () => {
    if (b.disabled) return;
    _logState.page += (+b.dataset.d); _logState.sig = "";
    renderLogs(host, logs);
    const bx = host.querySelector(".logs"); if (bx) bx.scrollTop = 0;
  }));
  host.querySelectorAll(".logrow").forEach(row => {
    const k = row.dataset.k, det = row.querySelector(".ldetail");
    row.querySelector(".lhead").addEventListener("click", () => {
      const nowOpen = det.hidden;
      det.hidden = !nowOpen;
      row.classList.toggle("open", nowOpen);
      // Expanded rows survive the next poll because they are remembered by a
      // stable key rather than being implicit DOM state.
      if (nowOpen) _logState.open.add(k); else _logState.open.delete(k);
    });
    const cb = row.querySelector(".copybtn");
    if (cb) cb.addEventListener("click", async e => {
      e.stopPropagation();
      const txt = row.querySelector("pre.code").textContent;
      try { await navigator.clipboard.writeText(txt); }
      catch (_) {
        const ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } finally { ta.remove(); }
      }
      cb.textContent = "Copied";
      setTimeout(() => { cb.textContent = "Copy JSON"; }, 1200);
    });
  });
}

/* Rejects by reason -- the frequency data behind the alerts. Alerts are a
   current-state list; this is what is actually recurring. */
function chartRejects(host, dlq) {
  if (!dlq.length) { host.innerHTML = '<p class="empty">no rejected records</p>'; return; }
  const max = Math.max(...dlq.map(d => d.count), 1);
  host.innerHTML = dlq.slice(0, 8).map(d =>
    '<div class="rejrow">' +
      '<span class="rlbl">' + esc(d.reason) + '</span>' +
      '<span class="rbar"><span style="width:' + (d.count / max * 100).toFixed(1) +
        '%"></span></span>' +
      '<span class="rval">' + fmt(d.count) + '</span>' +
    '</div>').join("");
}

let _alertPage = 0;
function renderAlerts(host, alerts) {
  if (!alerts.length) {
    host.innerHTML = '<div class="ok-state">No alerts \— every rule below threshold.</div>';
    return;
  }
  const PER = 5;
  const pages = Math.max(1, Math.ceil(alerts.length / PER));
  if (_alertPage >= pages) _alertPage = pages - 1;
  const slice = alerts.slice(_alertPage * PER, _alertPage * PER + PER);
  const crit = alerts.filter(a => a.level === "critical").length;
  host.innerHTML =
    '<div class="logbar"><span class="acount">' + crit + ' critical \· ' +
      (alerts.length - crit) + ' warning</span><span class="grow"></span>' +
      (pages > 1
        ? '<span class="pageinfo">' + (_alertPage + 1) + '/' + pages + '</span>' +
          '<button class="pg" data-d="-1"' + (_alertPage === 0 ? " disabled" : "") + '>\‹</button>' +
          '<button class="pg" data-d="1"' + (_alertPage >= pages - 1 ? " disabled" : "") + '>\›</button>'
        : "") +
    '</div>' +
    slice.map(a =>
      '<div class="alert ' + a.level + '">' +
        '<span class="lv">' + (a.level === "critical" ? "CRIT" : "WARN") + '</span>' +
        '<span class="ttl">' + esc(a.title) + '</span>' +
        '<span class="val">' + esc(String(a.value)) + esc(a.unit) + '</span>' +
        '<span class="thr">threshold ' + esc(String(a.threshold)) + esc(a.unit) + '</span>' +
      '</div>').join("");
  host.querySelectorAll(".pg").forEach(b => b.addEventListener("click", () => {
    if (b.disabled) return;
    _alertPage += (+b.dataset.d);
    renderAlerts(host, alerts);
  }));
}

/* =========================================================================
   Replay view: the concurrency curve building as the stream arrives.

   This is the demo the brief asks for -- ingest the session stream, watch the
   curve build as sessions open, heartbeat and close, then filter and have the
   minute-grain view still answer. The curve is drawn from the replay tables,
   so it genuinely grows; it is not a pre-computed series revealed slowly.
   ========================================================================= */
/* =========================================================================
   Replay view.

   Polling must UPDATE, not repaint. The first version rebuilt every card's
   innerHTML each tick, which cleared the SVG and the status table and rebuilt
   them three seconds later -- visible as a flash, and it destroyed anything
   the reader was interacting with. Now the chart skeleton is built once and
   subsequent ticks only set path geometry and text nodes.
   ========================================================================= */
let _rpTimer = null;
let _rpBuilt = false;
function stopReplay() {
  if (_rpTimer) { clearInterval(_rpTimer); _rpTimer = null; }
  _rpBuilt = false;
}

function buildReplayChart(host) {
  const W = host.clientWidth || 900, H = 300;
  host.innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" id="rpsvg">' +
      '<g id="rpgrid"></g><g id="rpxlab"></g>' +
      '<path id="rparea" fill="var(--s1)" opacity=".10" d=""/>' +
      '<path id="rpline" fill="none" stroke="var(--s1)" stroke-width="2" ' +
        'stroke-linejoin="round" d=""/>' +
      '<circle id="rplead" r="5" fill="var(--s1)" cx="-10" cy="-10">' +
        '<animate attributeName="r" values="4;7;4" dur="1.6s" repeatCount="indefinite"/>' +
      '</circle>' +
      '<line id="rpcross" y1="12" y2="264" stroke="var(--axis)" stroke-width="1" ' +
        'style="display:none"/>' +
      '<circle id="rpdot" r="4" fill="var(--surface)" stroke="var(--s1)" ' +
        'stroke-width="2" cx="-10" cy="-10" style="display:none"/>' +
      '<rect id="rphit" x="56" y="12" width="' + (W - 72) + '" height="264" ' +
        'fill="transparent"/>' +
    '</svg>' +
    '<p class="note-inline" id="rpcap"></p>';

  // Wired once, at build time. Re-attaching on every poll would leak
  // listeners; reading the series from a dataset slot keeps the handler
  // valid as the data grows underneath it.
  const svg = host.querySelector("#rpsvg");
  const hit = svg.querySelector("#rphit");
  const cross = svg.querySelector("#rpcross");
  const dot = svg.querySelector("#rpdot");
  hit.addEventListener("pointermove", ev => {
    const pts = host._series || [];
    if (!pts.length) return;
    const bb = svg.getBoundingClientRect();
    const m = {t: 12, r: 16, b: 24, l: 56};
    const iw = W - m.l - m.r, ih = H - m.t - m.b, n = pts.length;
    const maxY = Math.max(1, ...pts.map(p => p[1]));
    const px = (ev.clientX - bb.left) / bb.width * W;
    let i = Math.round((px - m.l) / (iw || 1) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    const x = m.l + (n < 2 ? iw / 2 : i / (n - 1) * iw);
    const y = m.t + ih - (pts[i][1] / maxY) * ih;
    cross.style.display = ""; cross.setAttribute("x1", x); cross.setAttribute("x2", x);
    dot.style.display = ""; dot.setAttribute("cx", x); dot.setAttribute("cy", y);
    showTip(ev.clientX, ev.clientY,
      '<div class="when">' + esc(pts[i][0]) + ' UTC</div>' +
      '<div class="r"><span class="k" style="background:var(--s1)"></span>' +
      '<span class="v">' + fmt(pts[i][1]) + '</span>' +
      '<span class="n">concurrent</span></div>');
  });
  hit.addEventListener("pointerleave", () => {
    hideTip(); cross.style.display = "none"; dot.style.display = "none";
  });
  return {W: W, H: H};
}

function updateReplayChart(host, series) {
  const svg = host.querySelector("#rpsvg");
  if (!svg) return;
  host._series = series;          // the hover handler reads the live series
  const vb = svg.getAttribute("viewBox").split(" ");
  const W = +vb[2], H = +vb[3], m = {t: 12, r: 16, b: 24, l: 56};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = series.length;
  const cap = host.querySelector("#rpcap");

  if (!n) {
    svg.querySelector("#rpline").setAttribute("d", "");
    svg.querySelector("#rparea").setAttribute("d", "");
    svg.querySelector("#rplead").setAttribute("cx", -10);
    if (cap) cap.textContent = "Waiting for the first events to arrive…";
    return;
  }
  const maxY = Math.max(1, ...series.map(p => p[1]));
  const X = i => m.l + (n < 2 ? iw / 2 : i / (n - 1) * iw);
  const Y = v => m.t + ih - (v / maxY) * ih;
  const d = series.map((p, i) =>
    (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");

  svg.querySelector("#rpline").setAttribute("d", d);
  svg.querySelector("#rparea").setAttribute("d",
    d + " L" + X(n - 1).toFixed(1) + " " + (m.t + ih) +
    " L" + X(0).toFixed(1) + " " + (m.t + ih) + " Z");
  const lead = svg.querySelector("#rplead");
  lead.setAttribute("cx", X(n - 1));
  lead.setAttribute("cy", Y(series[n - 1][1]));

  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const v = maxY * i / 4, y = Y(v);
    grid += '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y + '" y2="' + y +
      '" stroke="var(--line-2)"/><text x="' + (m.l - 8) + '" y="' + (y + 4) +
      '" text-anchor="end" font-size="11" fill="var(--ink-3)">' +
      fmt(Math.round(v)) + '</text>';
  }
  svg.querySelector("#rpgrid").innerHTML = grid;

  let xl = "";
  for (let i = 0; i <= 3; i++) {
    const idx = Math.round(i / 3 * (n - 1));
    xl += '<text x="' + X(idx) + '" y="' + (H - 6) + '" text-anchor="' +
      (i === 0 ? "start" : i === 3 ? "end" : "middle") +
      '" font-size="11" fill="var(--ink-3)">' +
      esc(String(series[idx][0]).slice(5, 16)) + '</text>';
  }
  svg.querySelector("#rpxlab").innerHTML = xl;
  if (cap) cap.textContent =
    fmt(n) + " minutes reconstructed · the pulsing point is the ingest watermark";
}

const RP_FIELDS = [
  ["rp-wm", "Ingest watermark"], ["rp-sent", "Events sent"],
  ["rp-stored", "Events stored"], ["rp-open", "Open sessions"],
  ["rp-peak", "Peak reached"], ["rp-upd", "Last update"],
];

function buildReplayStatus(host) {
  host.innerHTML =
    '<div class="rpstat idle" id="rp-badge"><span class="rpdot"></span>' +
      '<span id="rp-badge-t">Checking…</span></div>' +
    '<table class="kv2"><tbody>' +
    RP_FIELDS.map(f => '<tr><td class="k">' + esc(f[1]) +
      '</td><td class="v" id="' + f[0] + '">—</td></tr>').join("") +
    '</tbody></table><p class="note-inline" id="rp-hint"></p>';
}

async function viewReplay(main) {
  main.innerHTML = '<div class="grid" id="g">' +
    tile("Concurrent viewers", "…", "at the ingest watermark", "s1") +
    tile("Peak so far", "…", "highest reached in this replay") +
    tile("Still watching", "…", "sessions with no end event yet") +
    tile("Events ingested", "…", "of the day being replayed") +
    card("Concurrency as the day replays",
      "Reconstructed from the replay tables as events arrive, so it genuinely grows. " +
      "Every row is a real event from the dataset, streamed in event-time order — the " +
      "speed setting compresses the spacing between them and invents nothing.",
      '<div id="rpchart"></div>', "col-12") +
    card("Peak by platform, live",
      "Filters apply to the live curve exactly as they do to the sealed one — narrowing " +
      "still answers at minute grain while ingestion is in flight.",
      '<div id="rpplat">' + skeleton(4) + '</div>', "col-6") +
    card("Replay status", "", '<div id="rpstate"></div>', "col-6") +
    '</div>';

  buildReplayChart($("#rpchart"));
  buildReplayStatus($("#rpstate"));
  _rpBuilt = true;

  async function tick() {
    let d;
    try { d = await api("/api/replay"); }
    catch (e) { return; }
    if (state.tab !== "replay") { stopReplay(); return; }
    const g = $("#g").children;
    const st = d.state || {};
    countUp(g[0].querySelector(".value"), d.concurrent_now || 0);
    g[0].querySelector(".note").textContent = st.watermark
      ? "at " + String(st.watermark).slice(11, 16) + " UTC (ingest watermark)"
      : "at the ingest watermark";
    countUp(g[1].querySelector(".value"), d.peak_now || 0);
    countUp(g[2].querySelector(".value"), d.open_now || 0);
    countUp(g[3].querySelector(".value"), d.stored_now || 0);
    g[3].querySelector(".note").textContent =
      st.events_sent ? fmt(st.events_sent) + " sent" : "of the day being replayed";

    window._replaySpan = d.series.length
      ? {from: String(d.series[0][0]).slice(0, 16),
         to: String(d.series[d.series.length - 1][0]).slice(0, 16)}
      : null;
    renderRange();
    updateReplayChart($("#rpchart"), d.series);

    // The bar chart is small and fully data-driven, so a redraw is honest --
    // but only when the values actually changed.
    const sig = d.platforms.map(p => p.platform + ":" + p.peak).join("|");
    if (sig !== $("#rpplat").dataset.sig) {
      $("#rpplat").dataset.sig = sig;
      chartBars($("#rpplat"), d.platforms.map(p =>
        ({...p, value: p.platform, sessions: p.peak})), "peak", "platform", "--s1");
    }

    const badge = $("#rp-badge"), bt = $("#rp-badge-t");
    badge.className = "rpstat " + (st.running ? "live" : "idle");
    bt.textContent = st.running
      ? "Replaying at " + fmt(st.speed || 0) + "× event time"
      : (st.watermark ? "Idle — last replay finished" : "No replay has run");
    const vals = {
      "rp-wm": st.watermark || "—",
      "rp-sent": fmt(st.events_sent || 0),
      "rp-stored": fmt(d.stored_now || 0),
      "rp-open": fmt(d.open_now || 0),
      "rp-peak": fmt(d.peak_now || 0),
      "rp-upd": (st.at || "").slice(0, 19) || "—",
    };
    for (const k in vals) {
      const el = document.getElementById(k);
      if (el && el.textContent !== vals[k]) el.textContent = vals[k];
    }
    const hint = $("#rp-hint");
    hint.innerHTML = st.running ? "" :
      'Start one with <code>python scripts/replay.py --raw &lt;day.csv&gt; --speed 480</code>';
    perf(d);
  }
  await tick();
  stopReplay();
  _rpBuilt = true;
  _rpTimer = setInterval(tick, 3000);
}

/* Two inputs, and what each answers. A fact table and a dimension table have
   different jobs and different shapes, and a configuration screen that lists
   them identically hides the thing a reader most needs to understand. */
function renderDatasets(host, ds) {
  const order = ["raw_events", "content_dim"];
  host.innerHTML = '<div class="dsgrid">' + order.map(t => {
    const d = ds[t];
    if (!d) return "";
    const isFact = d.role.indexOf("Fact") === 0;
    return '<div class="dscard ' + (isFact ? "fact" : "dim") + '">' +
      '<div class="dshead">' +
        '<span class="dsrole">' + esc(d.role) + '</span>' +
        '<code class="dstable">' + esc(d.table) + '</code>' +
        '<span class="dsrows">' + fmt(d.rows) + ' rows</span>' +
      '</div>' +
      '<div class="dsans"><div class="dsans-h">Answers</div><ul>' +
        d.answers.map(a => '<li>' + esc(a) + '</li>').join("") + '</ul></div>' +
      '<div class="dsfields"><div class="dsans-h">Fields · ' + d.columns.length + '</div>' +
        '<div class="fieldlist">' + d.columns.map(c =>
          '<div class="fld"><code>' + esc(c.name) + '</code><span>' +
          esc(c.type) + '</span></div>').join("") + '</div></div>' +
      '<div class="dsmeta">' +
        '<div><b>Grain</b> ' + esc(d.grain) + '</div>' +
        '<div><b>Key</b> <code>' + esc(d.key) + '</code></div>' +
        '<div class="dswhy">' + esc(d.why) + '</div>' +
      '</div>' +
    '</div>';
  }).join("") + '</div>';
}

/* The derive path as it actually runs. `via` names the mechanism, so the
   diagram cannot imply a materialized view where an explicit step runs. */
function renderLineage(host, steps) {
  host.innerHTML = '<div class="lin">' + steps.map((s, i) =>
    '<div class="linstep ' + s.kind + '">' +
      '<div class="linrow">' +
        '<span class="lindot"></span>' +
        '<code class="linlabel">' + esc(s.label) + '</code>' +
        '<span class="linkind">' + esc(s.kind) + '</span>' +
      '</div>' +
      '<div class="linvia">' + esc(s.via) + '</div>' +
      (i < steps.length - 1 ? '<div class="linarrow">&#8595;</div>' : "") +
    '</div>').join("") + '</div>' +
    '<p class="note-inline">The dimension is <b>joined, not dictGet</b>: a dictionary is a ' +
    'node-local cache, and on Cloud a reload without <code>ON CLUSTER</code> refreshes one ' +
    'node — it returned empty for every row while reporting LOADED. Session aggregates are an ' +
    'explicit step rather than a materialized view, because the oracle parity gate verifies ' +
    'that derivation and an MV would make it implicit.</p>';
}

/* ---- diverging churn: opens above the axis, closes below -------------- */
function chartChurn(host, pts) {
  if (!pts.length) { host.innerHTML = '<p class="empty">no session churn in this window</p>'; return; }
  const W = host.clientWidth || 900, H = 190, mid = H / 2;

  // Over the full range there are more minutes than pixels. Clamping the bar
  // width to a legible floor without reducing the bar COUNT draws
  // pts.length * floor px of chart into W px of card -- the overflow. Bucket
  // to what actually fits instead, carrying the max so a churn spike inside a
  // bucket still reaches full height rather than being averaged away.
  const MINW = 0.8;
  const cap = Math.max(1, Math.floor(W / MINW));
  let data = pts, span = 1;
  if (pts.length > cap) {
    span = Math.ceil(pts.length / cap);
    data = [];
    for (let i = 0; i < pts.length; i += span) {
      const seg = pts.slice(i, i + span);
      data.push({ minute: seg[0].minute, span: seg.length,
                  opened: Math.max(...seg.map(s => s.opened)),
                  closed: Math.max(...seg.map(s => s.closed)) });
    }
  }

  const max = Math.max(1, ...data.map(p => Math.max(p.opened, p.closed)));
  const bw = W / data.length;
  const bars = data.map((p, i) => {
    const x = i * bw, ho = p.opened / max * (mid - 14), hc = p.closed / max * (mid - 14);
    return '<g class="ch"><rect x="' + x + '" y="' + (mid - ho) + '" width="' +
      Math.max(0.7, bw - .4) + '" height="' + ho + '" fill="var(--s1)"/>' +
      '<rect x="' + x + '" y="' + mid + '" width="' + Math.max(0.7, bw - .4) +
      '" height="' + hc + '" fill="var(--s2)"/></g>';
  }).join("");
  host.innerHTML = '<div class="legend">' +
    '<span class="key"><span class="swatch box" style="background:var(--s1)"></span>sessions opened</span>' +
    '<span class="key"><span class="swatch box" style="background:var(--s2)"></span>sessions closed</span>' +
    '<span class="key">peak ' + fmt(max) + '/min</span>' +
    (span > 1 ? '<span class="key muted">' + fmt(span) +
      ' min per bar · max</span>' : '') + '</div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '">' +
    '<line x1="0" x2="' + W + '" y1="' + mid + '" y2="' + mid + '" stroke="var(--line)"/>' +
    bars + '<rect id="churnhit" x="0" y="0" width="' + W + '" height="' + H +
    '" fill="transparent"/></svg>';
  const svg = host.querySelector("svg");
  const hit = svg.querySelector("#churnhit");
  hit.addEventListener("pointermove", ev => {
    const bb = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(data.length - 1,
      Math.floor((ev.clientX - bb.left) / bb.width * data.length)));
    const p = data[i];
    showTip(ev.clientX, ev.clientY,
      '<div class="when">' + esc(p.minute) + ' UTC' +
      (p.span > 1 ? ' · ' + fmt(p.span) + ' min' : '') + '</div>' +
      '<div class="r"><span class="k" style="background:var(--s1)"></span><span class="v">' +
      fmt(p.opened) + '</span><span class="n">opened</span></div>' +
      '<div class="r"><span class="k" style="background:var(--s2)"></span><span class="v">' +
      fmt(p.closed) + '</span><span class="n">closed</span></div>' +
      '<div class="r"><span class="k" style="background:transparent"></span><span class="v">' +
      fmt(p.opened - p.closed) + '</span><span class="n">net</span></div>');
  });
  hit.addEventListener("pointerleave", hideTip);
}

/* ---- QoE scatter: volume vs experience, bubble size = errors ---------- */
function chartQoE(host, rows) {
  if (!rows.length) { host.innerHTML = '<p class="empty">no platform data</p>'; return; }
  const W = host.clientWidth || 520, H = 300, m = {t:14, r:18, b:38, l:52};
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxX = Math.max(...rows.map(r => r.sessions), 1);
  const maxY = Math.max(...rows.map(r => r.rebuffers_per_session), 1);
  const maxE = Math.max(...rows.map(r => r.errors), 1);
  // sqrt on X: session counts are heavily skewed toward one platform, and a
  // linear axis would pile nine platforms into the left margin.
  const X = v => m.l + Math.sqrt(v / maxX) * iw;
  const Y = v => m.t + ih - (v / maxY) * ih;
  const R = v => 5 + Math.sqrt(v / maxE) * 15;
  const grid = [0, .25, .5, .75, 1].map(f => {
    const y = m.t + ih - f * ih;
    return '<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y + '" y2="' + y +
      '" stroke="var(--line-2)"/><text x="' + (m.l - 8) + '" y="' + (y + 4) +
      '" text-anchor="end" font-size="10" fill="var(--ink-3)">' +
      (maxY * f).toFixed(1) + '</text>';
  }).join("");
  const dots = rows.map((r, i) =>
    '<g class="qd" data-i="' + i + '"><circle cx="' + X(r.sessions) + '" cy="' +
    Y(r.rebuffers_per_session) + '" r="' + R(r.errors) +
    '" fill="var(--s2)" fill-opacity=".22" stroke="var(--s2)" stroke-width="1.5"/>' +
    '<circle cx="' + X(r.sessions) + '" cy="' + Y(r.rebuffers_per_session) +
    '" r="22" fill="transparent"/></g>').join("");
  // Anchor labels inward near the plot edges. A middle-anchored label on the
  // rightmost bubble extends past the card; clamping the anchor keeps every
  // label inside the frame without moving the data point.
  const labels = rows.slice(0, 4).map(r => {
    const cx = X(r.sessions);
    const near = cx > W - m.r - 60 ? "end" : cx < m.l + 60 ? "start" : "middle";
    const lx = near === "end" ? Math.min(cx, W - m.r) : near === "start" ? Math.max(cx, m.l) : cx;
    return '<text x="' + lx + '" y="' + (Y(r.rebuffers_per_session) - R(r.errors) - 5) +
      '" text-anchor="' + near + '" font-size="10" fill="var(--ink-2)">' +
      esc(r.platform) + '</text>';
  }).join("");
  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '">' + grid + dots + labels +
    '<text x="' + (W - m.r) + '" y="' + (H - 8) + '" text-anchor="end" font-size="10" ' +
    'fill="var(--ink-3)">more sessions &#8594;</text>' +
    '<text x="10" y="' + (m.t + 8) + '" font-size="10" fill="var(--ink-3)">rebuffers/session</text>' +
    '</svg><p class="note-inline">Bubble size is total errors. Up and to the right is the ' +
    'worst place to be: many viewers, poor experience. X uses a square-root scale because ' +
    'session counts are heavily skewed toward one platform.</p>';
  host.querySelectorAll(".qd").forEach(g => {
    const r = rows[+g.dataset.i];
    g.style.cursor = "pointer";
    g.addEventListener("pointermove", ev => showTip(ev.clientX, ev.clientY,
      '<div class="when">' + esc(r.platform) + '</div>' +
      '<div class="r"><span class="k" style="background:var(--s2)"></span><span class="v">' +
      r.rebuffers_per_session + '</span><span class="n">rebuffers/session</span></div>' +
      '<div class="r"><span class="k" style="background:transparent"></span><span class="v">' +
      fmt(r.sessions) + '</span><span class="n">sessions</span></div>' +
      '<div class="r"><span class="k" style="background:transparent"></span><span class="v">' +
      fmt(r.errors) + '</span><span class="n">errors</span></div>' +
      '<div class="r"><span class="k" style="background:transparent"></span><span class="v">' +
      r.dropped_per_session + '</span><span class="n">dropped frames/session</span></div>'));
    g.addEventListener("pointerleave", hideTip);
    g.addEventListener("click", () => toggleFilter("platform", r.platform));
  });
}

/* ---- two-series incident timeline ------------------------------------ */
function chartIncidents(host, pts) {
  if (!pts.length) { host.innerHTML = '<p class="empty">no errors or rebuffering in this window</p>'; return; }
  const W = host.clientWidth || 900, H = 170, m = {t:10, r:10, b:20, l:44};
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = pts.length;
  const max = Math.max(1, ...pts.map(p => Math.max(p.errors, p.rebuffers)));
  const X = i => m.l + (n < 2 ? iw/2 : i/(n-1)*iw);
  const Y = v => m.t + ih - (v/max)*ih;
  const line = k => pts.map((p,i) => (i?"L":"M") + X(i).toFixed(1) + " " + Y(p[k]).toFixed(1)).join(" ");
  host.innerHTML = '<div class="legend">' +
    '<span class="key"><span class="swatch" style="background:var(--s4)"></span>rebuffer starts</span>' +
    '<span class="key"><span class="swatch" style="background:var(--crit)"></span>playback errors</span>' +
    '<span class="key">peak ' + fmt(max) + '/min</span></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '">' +
    '<path class="animline" pathLength="1" d="' + line('rebuffers') +
      '" fill="none" stroke="var(--s4)" stroke-width="1.6"/>' +
    '<path class="animline" pathLength="1" style="animation-delay:.1s" d="' + line('errors') +
      '" fill="none" stroke="var(--crit)" stroke-width="2"/>' +
    '<line id="xh" y1="' + m.t + '" y2="' + (m.t+ih) + '" stroke="var(--ink-3)" stroke-width="1" style="display:none"/>' +
    '<rect x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih +
    '" fill="transparent" id="ihit"/></svg>';
  const svg = host.querySelector("svg"), xh = svg.querySelector("#xh");
  const hit = svg.querySelector("#ihit");
  hit.addEventListener("pointermove", ev => {
    const bb = svg.getBoundingClientRect();
    let i = Math.round(((ev.clientX - bb.left)/bb.width*W - m.l)/(iw||1)*(n-1));
    i = Math.max(0, Math.min(n-1, i));
    xh.style.display = ""; xh.setAttribute("x1", X(i)); xh.setAttribute("x2", X(i));
    showTip(ev.clientX, ev.clientY,
      '<div class="when">' + esc(pts[i].minute) + ' UTC</div>' +
      '<div class="r"><span class="k" style="background:var(--s4)"></span><span class="v">' +
      fmt(pts[i].rebuffers) + '</span><span class="n">rebuffers</span></div>' +
      '<div class="r"><span class="k" style="background:var(--crit)"></span><span class="v">' +
      fmt(pts[i].errors) + '</span><span class="n">errors</span></div>');
  });
  hit.addEventListener("pointerleave", () => { hideTip(); xh.style.display = "none"; });
}

/* ---- 100% stacked bar for close-reason mix --------------------------- */
function chartStack(host, obj) {
  const entries = Object.entries(obj).sort((a,b) => b[1]-a[1]);
  const total = entries.reduce((a,kv) => a+kv[1], 0) || 1;
  const colors = ["--s1","--s3","--s4","--crit","--s5"];
  const segs = entries.map((kv,i) =>
    '<div class="seg" style="width:' + (kv[1]/total*100) + '%;background:var(' +
    colors[i%colors.length] + ')" title="' + esc(kv[0]) + ': ' + fmt(kv[1]) + '"></div>').join("");
  host.innerHTML = '<div class="stackbar">' + segs + '</div>' +
    '<div class="legend" style="margin-top:10px">' + entries.map((kv,i) =>
      '<span class="key"><span class="swatch box" style="background:var(' +
      colors[i%colors.length] + ')"></span>' + esc(kv[0]) +
      ' <b style="color:var(--ink-1)">' + (kv[1]/total*100).toFixed(1) + '%</b></span>').join("") +
    '</div>';
}

async function viewLiveOps(main) {
  main.innerHTML = '<div class="grid" id="g">' +
    tile("Concurrent now", "&hellip;", "at window end") +
    tile("Peak", "&hellip;", "in window", "s1") +
    tile("Rebuffer rate", "&hellip;", "of sessions affected") +
    tile("Error rate", "&hellip;", "of sessions affected") +
    card("Concurrency decline watch",
      "The signals are measured in ClickHouse, the verdict is a declared rule over them, " +
      "and the narrative is written by Gemini through LiteLLM from those signals only — " +
      "the model sees nothing it could invent from. Alerts also land in ClickStack as OTel events.",
      '<div id="decline">' + skeleton(2) + '</div>', "col-12") +
    card("Session churn",
      "Opens and closes per minute, drawn from the delta stream itself — the +1 and −1 " +
      "that build the concurrency curve. Net churn is what capacity has to absorb.",
      '<div id="churn">' + skeleton(3) + '</div>', "col-12") +
    card("Incidents over time",
      "Rebuffer starts and playback errors per minute, so a spike is locatable in time " +
      "rather than only visible as a total.",
      '<div id="incidents">' + skeleton(3) + '</div>', "col-7") +
    card("Experience by platform",
      "Volume against experience, bubble size by error count. Click a bubble to scope the page.",
      '<div id="qoe">' + skeleton(4) + '</div>', "col-5") +
    card("How sessions ended",
      "evidence_gap is inferred from client silence; every other reason is explicitly observed.",
      '<div id="stack">' + skeleton(2) + '</div>', "col-7") +
    card("Signal quality",
      "Degradation signals the concurrency model deliberately does not use, but which an " +
      "operator acts on during a live event.",
      '<div id="sig">' + skeleton(4) + '</div>', "col-5") +
    card("Platform detail", "Sortable. Click a row to scope the page to that platform.",
      '<div id="ptbl">' + skeleton(4) + '</div>', "col-12") +
    '</div>';

  const d = await api("/api/live_ops");
  const g = $("#g").children;
  countUp(g[0].querySelector(".value"), d.current);
  countUp(g[1].querySelector(".value"), d.peak);
  g[1].querySelector(".note").textContent = "peak at " + (d.peak_at || "—");

  const rb = g[2].querySelector(".value");
  rb.textContent = d.rebuffer_rate_pct + "%";
  rb.className = "value " + (d.rebuffer_rate_pct > 40 ? "crit" : d.rebuffer_rate_pct > 15 ? "" : "good");
  g[2].querySelector(".note").textContent =
    fmt(d.rebuffers) + " starts · " + d.rebuffers_per_session + " per session";

  const er = g[3].querySelector(".value");
  er.textContent = d.error_rate_pct + "%";
  er.className = "value " + (d.error_rate_pct > 5 ? "crit" : d.error_rate_pct > 1 ? "" : "good");
  g[3].querySelector(".note").textContent = fmt(d.errors) + " VideoError events";

  chartChurn($("#churn"), d.churn);
  chartIncidents($("#incidents"), d.error_timeline);
  chartQoE($("#qoe"), d.platforms);
  chartStack($("#stack"), d.closes);

  api("/api/decline").then(dw => {
    const host = $("#decline");
    if (!host) return;
    const s = dw.signals || {};
    const tone = dw.status === "ok" ? "ok" : "bad";
    const causeLabel = {system_issue: "system issue", asset_ended: "asset ended",
                        engagement_drop: "engagement drop"}[dw.cause] || dw.cause;
    host.innerHTML =
      '<div class="verdict ' + tone + '">' +
        (dw.status === "ok" ? "No material decline" :
          "ALERT · " + esc(causeLabel) + " · " + s.decline_pct + "% off the 30-min peak") +
      '</div>' +
      '<p style="margin:10px 0 12px;line-height:1.6">' + esc(dw.narrative || "") +
        ' <span class="dim">— ' + esc(dw.narrated_by || "") + '</span></p>' +
      '<table class="kv2"><tbody>' +
      [["Current / 30-min peak", fmt(s.current) + " / " + fmt(s.peak_30m)],
       ["Errors vs baseline", s.error_ratio_vs_baseline + "×"],
       ["Rebuffering vs baseline", s.rebuffer_ratio_vs_baseline + "×"],
       ["Session closes vs baseline", s.session_end_ratio_vs_baseline + "×"],
       ["New sessions vs baseline", s.new_session_ratio_vs_baseline + "×"],
       ["Rule thresholds", "alert at " + dw.thresholds.decline_pct + "% decline · signal ratio " +
         dw.thresholds.signal_ratio + "×"]].map(kv =>
        '<tr><td class="k">' + esc(kv[0]) + '</td><td class="v">' + esc(String(kv[1])) +
        '</td></tr>').join("") + '</tbody></table>';
  }).catch(() => {
    const host = $("#decline");
    if (host) host.innerHTML = '<p class="err">decline watch unavailable</p>';
  });

  $("#sig").innerHTML = '<table><tbody>' +
    '<tr><td>Dropped frames</td><td class="strong">' + fmt(d.dropped_frames) + '</td></tr>' +
    '<tr><td>Bitrate downshifts</td><td class="strong">' + fmt(d.downshifts) + '</td></tr>' +
    '<tr><td>Bitrate upshifts</td><td class="strong">' + fmt(d.upshifts) + '</td></tr>' +
    '<tr><td>Heartbeat loss (inferred close)</td><td class="strong">' + d.heartbeat_loss_pct + '%</td></tr>' +
    '<tr><td>Backgrounded</td><td class="strong">' + d.backgrounded_pct + '%</td></tr>' +
    '<tr><td>Ingest lag</td><td class="strong">' + fmt1(d.ingest_lag_s) + ' s</td></tr>' +
    '</tbody></table>';

  renderTable($("#ptbl"), d.platforms.map(r => ({...r, value: r.platform})), [
    {k:"value", t:"platform"},
    {k:"sessions", t:"sessions"},
    {k:"rebuffers", t:"rebuffer starts"},
    {k:"rebuffers_per_session", t:"per session", f:fmt1},
    {k:"errors", t:"errors"},
    {k:"dropped_per_session", t:"dropped/session", f:fmt1, dim:true},
  ], "platform");
  perf(d);
}

async function viewLive(main) {
  main.innerHTML = `<div class="grid" id="g">
    ${tile("Kafka backlog","…","messages in sony.events")}
    ${tile("Dedup keys","…","Redis idempotency set")}
    ${tile("Open sessions","…","cached in Redis")}
    ${tile("DLQ","…","records isolated")}
    ${card("Pipeline flow",
      "Particle rate on each edge is scaled from the live counters, so the animation "
      + "carries information: a stalled consumer stops moving, and the reject path "
      + "only animates when records are actually being quarantined.",
      `<div id="flow"></div>`, "col-12")}
    ${card("Ingest rate",
      "Events per minute from the ingest_rate materialized view. Incremental on "
      + "insert — the cost is proportional to what arrived, not to what is retained.",
      `<div id="rate"></div>`, "col-12")}
    ${card("Producer schemas seen","A new fingerprint is a schema change. compatible=false means a required column could not be resolved.",
      `<div id="schemas"></div>`)}
    ${card("Dead letter queue","Malformed events isolated with their reason — the pipeline never stops for a bad record.",
      `<div id="dlq"></div>`)}
    ${card("Components","", `<div id="health"></div>`, "col-12")}
  </div>`;

  async function tick() {
    let d;
    try { d = await (await fetch("/api/pipeline_live")).json(); }
    catch (e) { return; }
    if (state.tab !== "live") { stopLive(); return; }
    const g = $("#g").children;
    const kb = d.kafka && d.kafka.topics["sony.events"];
    if (kb) countUp(g[0].querySelector(".value"), kb.messages);
    else g[0].querySelector(".value").textContent = "—";
    g[0].querySelector(".note").textContent = kb ? kb.partitions + " partitions" : "kafka unreachable";
    if (d.redis) countUp(g[1].querySelector(".value"), d.redis.dedup_keys);
    else g[1].querySelector(".value").textContent = "—";
    g[1].querySelector(".note").textContent = d.redis ? d.redis.memory + " resident" : "redis unreachable";
    if (d.redis) countUp(g[2].querySelector(".value"), d.redis.open_sessions);
    else g[2].querySelector(".value").textContent = "—";
    const dlqTotal = d.dlq.reduce((a, r) => a + r.count, 0);
    countUp(g[3].querySelector(".value"), dlqTotal);

    // Normalise each edge to 0..1 so the animation reflects relative activity.
    const okRows = d.clickhouse ? d.clickhouse.stream_rows : 0;
    const norm = v => Math.max(0, Math.min(1, v));
    renderFlow($("#flow"), {
      in:    norm((kb ? kb.messages : 0) / 50000),
      ok:    norm(okRows / 50000),
      dlq:   dlqTotal > 0 ? norm(dlqTotal / 5000) : 0,
      state: d.redis && d.redis.open_sessions > 0 ? norm(d.redis.open_sessions / 2000) : 0,
    });
    g[3].querySelector(".note").textContent = d.dlq.length + " distinct reasons";

    // ingest sparkline
    const pts = d.ingest;
    if (pts.length) {
      const W = $("#rate").clientWidth || 900, H = 130, max = Math.max(...pts.map(p=>p.events), 1);
      const bw = W / pts.length;
      $("#rate").innerHTML = `<svg viewBox="0 0 ${W} ${H}">` + pts.map((p,i) => {
        const h = Math.max(1, p.events / max * (H - 22));
        return `<rect x="${i*bw+0.5}" y="${H-20-h}" width="${Math.max(1,bw-1.5)}" height="${h}"
                 rx="2" fill="var(--s1)"><title>${esc(p.minute)} · ${fmt(p.events)} events</title></rect>`;
      }).join("") + `<text x="0" y="${H-4}" fill="var(--ink-muted)" font-size="11">${esc(pts[0].minute.slice(5,16))}</text>
        <text x="${W}" y="${H-4}" text-anchor="end" fill="var(--ink-muted)" font-size="11">${esc(pts[pts.length-1].minute.slice(5,16))} · peak ${fmt(max)}/min</text></svg>`;
    } else {
      $("#rate").innerHTML = `<p class="note-inline">no rows in the ingest-rate view yet</p>`;
    }

    $("#schemas").innerHTML = d.schemas.length ? `<table><thead><tr>
        <th>fingerprint</th><th>fields</th><th>compatible</th><th>unmapped</th></tr></thead><tbody>` +
      d.schemas.map(s => `<tr style="cursor:default">
        <td><code>${esc(s.fingerprint)}</code></td><td>${s.fields}</td>
        <td style="color:${s.compatible ? "var(--good)" : "var(--crit)"}">${s.compatible ? "yes" : "NO"}</td>
        <td class="dim" style="white-space:normal;text-align:left">${esc(s.unmapped || "—")}</td>
      </tr>`).join("") + `</tbody></table>`
      : `<p class="note-inline">no producer schemas registered yet</p>`;

    $("#dlq").innerHTML = d.dlq.length ? `<table><thead><tr>
        <th>reason</th><th>records</th></tr></thead><tbody>` +
      d.dlq.map(r => `<tr style="cursor:default"><td>${esc(r.reason)}</td>
        <td>${fmt(r.count)}</td></tr>`).join("") + `</tbody></table>`
      : `<p class="note-inline">DLQ empty</p>`;

    const comps = [
      ["Kafka / Redpanda", !d.errors.kafka, d.kafka ? d.kafka.broker : d.errors.kafka],
      ["Redis", !d.errors.redis, d.redis ? d.redis.memory + " used" : d.errors.redis],
      ["ClickHouse Cloud", !d.errors.clickhouse,
        d.clickhouse ? fmt(d.clickhouse.raw_events) + " rows in raw_events" : d.errors.clickhouse],
      ["Schema registry", !d.errors.schemas, d.schemas.length + " schemas seen"],
    ];
    $("#health").innerHTML = comps.map(([n, ok, det]) =>
      `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;
        border-bottom:1px solid var(--grid)">
        <span style="width:9px;height:9px;border-radius:50%;flex:none;
          background:${ok ? "var(--good)" : "var(--crit)"}"></span>
        <b style="min-width:190px">${esc(n)}</b>
        <span class="meta">${esc(String(det || ""))}</span></div>`).join("") +
      `<p class="note-inline">polling every 5 s · last response ${fmt1(d.latency_ms)} ms</p>`;
    perf({latency_ms: d.latency_ms, rows_read: 0});
  }
  await tick();
  stopLive();
  _liveTimer = setInterval(tick, 5000);
}

   Architecture. The diagram distinguishes what RUNS from what is DESIGNED.
   A node drawn as running that isn't survives exactly one question.

  ["Materialized views", "built", "ingest_rate and session_spans update incrementally on insert; the naive baseline reads session_spans (108k rows) instead of re-grouping 7M raw events. Interval derivation stays an explicit step ON PURPOSE — that is the step the oracle-parity gate certifies, and an MV would make it implicit."],
  ["Schema Registry", "built", "Every distinct producer key-set is fingerprinted into sony.schema_registry with a compatibility verdict — 4 schemas seen, 1 flagged incompatible. The loader's alias table enforces the same contract at batch ingest."],
  ["MCP + LibreChat + Gemini", "built", "Chat asks questions through MCP tools that wrap the verified queries — the model cannot invent SQL, and a failed query is reported as a failure, never estimated. LLM traces land in Langfuse."],
  ["Cloud Run + edge split", "built", "The dashboard is stateless over ClickHouse Cloud, so the hosted instance and a laptop are the same claim. Stateful edge services (Kafka, Redis, ClickStack, Langfuse, LibreChat, MCP) ship as one compose file: infra/edge-compose.yml."],
];

let _mermaidReady = false;
function loadMermaid() {
  if (_mermaidReady) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "/vendor/mermaid.min.js";
    s.onload = () => { _mermaidReady = true; res(); };
    s.onerror = () => rej(new Error("mermaid failed to load from /vendor"));
    document.head.appendChild(s);
  });
}

async function viewArchitecture(main) {
  main.innerHTML = `<div class="grid">
    ${card("Pipeline architecture","Every node drawn is running — this diagram is kept at parity with the system, not ahead of it. The one deliberate exception is labelled on the node: interval derivation stays an explicit, oracle-gated step rather than a materialized view.",
      `<div id="diagram" style="overflow-x:auto"></div>`, "col-12")}
    ${card("Why each component is there","", `<div id="components"></div>`, "col-12")}
    ${card("Query playground","Pick one of the project's real queries or write your own. Read-only.",
      `<div id="pg"></div>`, "col-12")}
  </div>`;

  $("#components").innerHTML = `<table><thead><tr>
      <th>Component</th><th>Status</th><th>Why</th></tr></thead><tbody>` +
    COMPONENTS.map(([n, st, why]) => `<tr style="cursor:default">
      <td>${esc(n)}</td>
      <td><span class="chip" style="border-color:${st==="built"?"var(--s1)":"var(--axis)"}">
        ${st === "built" ? "running" : "designed"}</span></td>
      <td class="dim" style="text-align:left;white-space:normal">${esc(why)}</td>
    </tr>`).join("") + `</tbody></table>`;

  try {
    await loadMermaid();
    const dark = getComputedStyle(document.documentElement)
      .getPropertyValue("--surface-1").trim().startsWith("#1");
    mermaid.initialize({startOnLoad:false, theme: dark ? "dark" : "default",
                        flowchart:{curve:"basis", htmlLabels:true}});
    const {svg} = await mermaid.render("archdiagram", ARCH);
    $("#diagram").innerHTML = svg;
  } catch (e) {
    $("#diagram").innerHTML = `<p class="err">diagram unavailable: ${esc(e.message)}</p>
      <pre class="note-inline" style="white-space:pre-wrap">${esc(ARCH)}</pre>`;
  }

  await renderPlayground($("#pg"));
}


/* Playground results are paged too: a read-only query can legitimately return
   500 rows and a 500-row wall is not a result, it is a scroll. */
let _resPage = 0;
function renderResultGrid(host, r) {
  const PER = 20;
  if (!r.columns.length) { host.innerHTML = '<p class="empty">no rows</p>'; return; }
  const pages = Math.max(1, Math.ceil(r.rows.length / PER));
  if (_resPage >= pages) _resPage = pages - 1;
  const start = _resPage * PER;
  host.innerHTML =
    (r.rows.length > PER
      ? '<div class="logbar"><span class="pageinfo">' + (start + 1) + '–' +
        Math.min(start + PER, r.rows.length) + ' of ' + fmt(r.rows.length) +
        (r.truncated ? ' (server capped at 500)' : "") + '</span><span class="grow"></span>' +
        '<button class="pg" data-d="-1"' + (_resPage === 0 ? " disabled" : "") + '>‹</button>' +
        '<button class="pg" data-d="1"' + (_resPage >= pages - 1 ? " disabled" : "") + '>›</button>' +
        '</div>'
      : "") +
    '<div class="tablewrap"><table><thead><tr>' +
      r.columns.map(c => '<th style="cursor:default">' + esc(c) + '</th>').join("") +
    '</tr></thead><tbody>' +
      r.rows.slice(start, start + PER).map(row =>
        '<tr>' + row.map(v => '<td>' + esc(v) + '</td>').join("") + '</tr>').join("") +
    '</tbody></table></div>' +
    (pages > 1
      ? '<div class="pager"><button class="pgbtn" data-d="-1"' +
          (_resPage === 0 ? " disabled" : "") + '>← Prev</button>' +
        '<span class="pgnum">Page ' + (_resPage + 1) + ' of ' + pages + '</span>' +
        '<button class="pgbtn" data-d="1"' + (_resPage >= pages - 1 ? " disabled" : "") +
        '>Next →</button></div>'
      : "");
  host.querySelectorAll(".pgbtn").forEach(b => b.addEventListener("click", () => {
    if (b.disabled) return;
    _resPage += (+b.dataset.d);
    renderResultGrid(host, r);
  }));
}

async function renderPlayground(host) {
  const cat = await (await fetch("/api/catalog")).json();
  host.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
      <select id="pg-pick" style="background:var(--surface-1);border:1px solid var(--hair);
        border-radius:8px;padding:7px 9px;max-width:100%">
        <option value="">— pick a query from the project —</option>
        ${cat.queries.map(q=>`<option value="${esc(q.id)}">${esc(q.name)}</option>`).join("")}
      </select>
      <label class="meta">runs
        <select id="pg-runs" style="background:var(--surface-1);border:1px solid var(--hair);
          border-radius:8px;padding:6px 8px">
          <option>1</option><option selected>3</option><option>5</option><option>9</option>
        </select></label>
      <button id="pg-run" class="ctl" style="background:var(--brand);color:var(--brand-ink);
        border:1px solid rgba(0,0,0,.2);border-radius:8px;padding:7px 14px;font-weight:650;
        cursor:pointer">Run</button>
      <span class="meta" id="pg-note"></span>
    </div>
    <textarea id="pg-sql" spellcheck="false" rows="10" style="width:100%;
      font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12.5px;
      background:var(--plane);color:var(--ink-1);border:1px solid var(--hair);
      border-radius:8px;padding:10px;resize:vertical"
      placeholder="SELECT ... — read-only statements only"></textarea>
    <div id="pg-metrics" style="margin-top:10px"></div>
    <div id="pg-out" style="margin-top:10px"></div>`;

  const byId = Object.fromEntries(cat.queries.map(q=>[q.id,q]));
  $("#pg-pick").addEventListener("change", e => {
    const q = byId[e.target.value];
    if (!q) return;
    $("#pg-sql").value = q.sql;
    $("#pg-note").textContent = q.note || "";
  });
  $("#pg-sql").value = byId.headline.sql;
  $("#pg-note").textContent = byId.headline.note;

  async function run() {
    const sql = $("#pg-sql").value.trim();
    if (!sql) return;
    $("#pg-out").innerHTML = `<p class="note-inline">running…</p>`;
    $("#pg-metrics").innerHTML = "";
    try {
      _resPage = 0;
      const r = await (await fetch("/api/playground?" + new URLSearchParams(
        {sql, runs: $("#pg-runs").value}))).json();
      if (r.error) throw new Error(r.error);
      const m = r.metrics;
      const tiles = [
        ["p50 latency", fmt1(m.p50_ms) + " ms", `${r.runs} run${r.runs>1?"s":""}, p95 ${fmt1(m.p95_ms)} ms`],
        ["rows read", fmt(m.read_rows), bytes(m.read_bytes) + " read"],
        ["result rows", fmt(m.result_rows), bytes(m.result_bytes) + " returned"],
        ["peak memory", bytes(m.peak_memory_bytes), "server-side"],
        ["parts / marks", (m.selected_parts??"—") + " / " + (m.selected_marks??"—"),
         m.estimated_rows!=null ? fmt(m.estimated_rows)+" rows estimated" : "EXPLAIN ESTIMATE"],
      ];
      $("#pg-metrics").innerHTML = `<div class="grid">` + tiles.map(([l,v,n]) =>
        `<div class="card tile col-3" style="padding:11px 13px">
           <div class="label">${esc(l)}</div>
           <div class="value" style="font-size:22px">${esc(v)}</div>
           <div class="note">${esc(n)}</div></div>`).join("") + `</div>
        <p class="note-inline">Not shown: ${r.unavailable.join(", ")} — these live in
        <code>system.query_log</code>, which is per-replica on ClickHouse Cloud, so a lookup
        lands on a node that may not have run the query. Stated rather than estimated.</p>`;
      if (!r.columns.length) { $("#pg-out").innerHTML = `<p class="note-inline">no rows</p>`; return; }
      renderResultGrid($("#pg-out"), r);
    } catch (e) {
      $("#pg-out").innerHTML = `<p class="err">${esc(e.message)}</p>`;
    }
  }
  $("#pg-run").addEventListener("click", run);
  $("#pg-sql").addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") run();
  });
  run();
}

const bytes = n => n == null ? "—" :
  n > 1e9 ? (n/1e9).toFixed(2)+" GB" : n > 1e6 ? (n/1e6).toFixed(1)+" MB" :
  n > 1e3 ? (n/1e3).toFixed(1)+" kB" : n + " B";

async function viewRegions(main) {
  main.innerHTML = '<div class="grid" id="g">' +
    tile("Sessions with a language", "…", "of all sessions") +
    tile("Regional languages", "…", "excluding Hindi and English") +
    tile("Not stated", "…", "no audio language at all") +
    tile("Unplaceable", "…", "English or other — no region") +
    card("Language regions of India",
      "Region is INFERRED from audio_language, not observed. Every event carries " +
      "country = india and there is no state, city, region, ISP or CDN field, so a true " +
      "choropleth would have one shape on it. All ten Hindi-belt states therefore carry " +
      "the same figure — this is a language map drawn on a state grid, not per-state data.",
      '<div id="map">' + skeleton(4) + '</div>', "col-6") +
    card("Audio language mix",
      "Normalised: hin / HIN / hin-hindi are one language. Attribution is the first " +
      "STATED language per session — players emit unk before the audio track resolves, " +
      "and naive attribution reports 80% unknown where the true figure is 0.5%.",
      '<div id="lang">' + skeleton(5) + '</div>', "col-6") +
    card("Language by platform", "Which surfaces carry which audiences.",
      '<div id="langtbl">' + skeleton(4) + '</div>', "col-12") +
    '</div>';

  const l = await api("/api/language");
  const T = l.total_sessions || 1;
  const by = Object.fromEntries(l.rows.map(r => [r.value, r.sessions]));
  const REGIONAL = ["Tamil","Telugu","Malayalam","Marathi","Kannada","Bengali"];
  const regional = REGIONAL.reduce((a, k) => a + (by[k] || 0), 0);
  const notStated = by["Not stated"] || 0;
  const unplaceable = (by["English"] || 0) + (by["Other"] || 0) + notStated;
  const g = $("#g").children;
  countUp(g[0].querySelector(".value"), T - notStated);
  g[0].querySelector(".note").textContent = ((T - notStated) / T * 100).toFixed(1) + "% of " + fmt(T);
  countUp(g[1].querySelector(".value"), regional);
  g[1].querySelector(".note").textContent = (regional / T * 100).toFixed(1) + "% of sessions";
  countUp(g[2].querySelector(".value"), notStated);
  g[2].querySelector(".note").textContent = (notStated / T * 100).toFixed(1) + "% of sessions";
  countUp(g[3].querySelector(".value"), unplaceable);
  g[3].querySelector(".note").textContent = (unplaceable / T * 100).toFixed(1) + "% cannot be placed";

  chartTileMap($("#map"), l.rows);
  chartBars($("#lang"), l.rows.map(r => ({...r})), "sessions", null, "--s1");
  renderTable($("#langtbl"), l.rows.map(r => ({...r})), [
    {k:"value", t:"language"},
    {k:"sessions", t:"sessions"},
    {k:"sessions", t:"share", f:v => (v / T * 100).toFixed(2) + "%", dim:true},
  ], null);
  perf(l);
}

const VIEWS = {overview:viewOverview, ops:viewOps, analyst:viewAnalyst,
               product:viewProduct, regions:viewRegions, pipeline:viewPipeline,
               live:viewLive, arch:viewArchitecture, liveops:viewLiveOps, ingest:viewIngest, config:viewConfig,
               replay:viewReplay};

function perf(r) {
  if (!r) return;
  $("#hdr-perf").innerHTML = `<b>${fmt1(r.latency_ms)} ms</b> · ${fmt(r.rows_read)} rows read`;
}

/* --- orchestration ------------------------------------------------------ */
function renderNav() {
  for (const [grp, host] of [["Monitor", "#nav-live"], ["Metrics", "#nav-main"], ["Traces", "#nav-plat"]]) {
    $(host).innerHTML = TABS.filter(t => t.grp === grp).map(t =>
      `<button data-t="${t.id}" ${t.id === state.tab ? 'aria-current="page"' : ""}>
         <span>${esc(t.name)}</span></button>`).join("");
    $(host).querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => go(b.dataset.t)));
  }
  const t = TABS.find(x => x.id === state.tab) || TABS[0];
  $("#page-title").textContent = t.name;
  $("#page-desc").textContent = t.desc;
}

function go(id) {
  if (id === state.tab) return;
  state.tab = id; location.hash = id;
  renderNav(); refresh();
  window.scrollTo({top: 0, behavior: "smooth"});
}

/* Every step ends by pointing at the next question, so the reader is carried
   through the argument instead of being left at the bottom of a page. */
function storyFooter() {
  const i = TABS.findIndex(t => t.id === state.tab);
  const prev = TABS[i - 1], next = TABS[i + 1];
  if (!prev && !next) return "";
  return `<div class="storynav col-12">
    ${prev ? `<button class="sn prev" data-go="${prev.id}">← ${esc(prev.name)}</button>` : `<span></span>`}
    ${next ? `<button class="sn next" data-go="${next.id}">${esc(next.name)} →</button>` : `<span></span>`}
  </div>`;
}

function wireStory(root) {
  (root || document).querySelectorAll("[data-go]").forEach(b =>
    b.addEventListener("click", () => go(b.dataset.go)));
}

let seq = 0;
async function refresh() {
  if (state.tab !== "live") stopLive();
  if (state.tab !== "ingest") stopIngest();
  if (state.tab !== "replay") stopReplay();
  renderFilters();
  const main = $("#main");
  main.classList.add("loading");           // hold the frame; no skeleton, no jump
  const mine = ++seq;
  try {
    const f = api("/api/facets").then(r => { if (mine===seq) FACETS = r.facets; });
    await (VIEWS[state.tab] || viewOverview)(main);
    wireInfo(main);
    await f; if (mine===seq) renderFilters();
  } catch (e) {
    // A stale render's abort is bookkeeping, not news; only the render that
    // currently owns the frame may report an error into it.
    if (mine === seq && e.message !== "__stale_render__")
      main.innerHTML = `<div class="card col-12"><p class="err">${esc(e.message)}</p></div>`;
  } finally { if (mine===seq) main.classList.remove("loading"); }
}

$("#refresh").addEventListener("click", () => refresh());
const _side = document.querySelector(".side"), _scrim = $("#navscrim");
function toggleNav(open) {
  _side.classList.toggle("open", open);
  _scrim.hidden = !open;
}
$("#navtoggle").addEventListener("click", e => {
  e.stopPropagation(); toggleNav(!_side.classList.contains("open"));
});
_scrim.addEventListener("click", () => toggleNav(false));
// Selecting a view on a narrow screen should close the drawer behind you.
document.querySelectorAll(".side nav").forEach(n =>
  n.addEventListener("click", () => { if (innerWidth <= 900) toggleNav(false); }));
$("#theme").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
             : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  refresh();
});
addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h && h !== state.tab) { state.tab = h; renderNav(); refresh(); }
});
addEventListener("resize", () => { clearTimeout(window._rz);
  window._rz = setTimeout(refresh, 220); });

(async function init() {
  OV = await (await fetch("/api/overview")).json();
  DIMS = (OV.dims || []).filter(d => d !== "country")   // one value; never narrows
          .map(k => ({key: k, label: DIM_LABEL[k] || k}));
  for (const d of DIMS) if (!state.sel[d.key]) state.sel[d.key] = [];
  $("#foot-host").textContent = OV.endpoint;
  $("#foot-ver").textContent =
    `ClickHouse ${OV.server} · ${fmt(OV.events)} events · ${fmt(OV.sessions)} sessions`;
  applyPreset(state.preset);
  renderNav();
  await refresh();
})();
</script>
