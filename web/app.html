<title>Watchhouse · Concurrency analytics for SonyLIV</title>
<style>
/* ===========================================================================
   Design tokens. One scale for type, one for space, one for elevation.
   Everything below references these -- no ad-hoc pixel values in components,
   which is the difference between a system and a pile of CSS.
   Data series use the validated categorical slots; ClickHouse yellow is
   chrome only, so a brand accent never carries a data value.
   =========================================================================== */
:root {
  color-scheme: light;
  /* surfaces */
  --bg:        #f4f4f1;
  --surface:   #ffffff;
  --surface-2: #fafaf8;
  --sidebar:   #17181a;
  --sidebar-2: #202226;
  /* ink */
  --ink-1: #16181d; --ink-2: #4a4f57; --ink-3: #7c828c; --ink-inv: #f7f7f5;
  /* lines */
  --line:   #e3e3de;
  --line-2: #ededea;
  --focus:  #2a78d6;
  /* data */
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --brand: #faff69; --brand-ink: #161616;
  /* type scale */
  --t-micro: 11px; --t-cap: 12px; --t-sm: 13px; --t-base: 14px;
  --t-lg: 16px; --t-xl: 20px; --t-num: 28px; --t-hero: 34px;
  /* space scale */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --r-sm: 5px; --r: 7px; --r-lg: 10px;
  --shadow: 0 1px 2px rgba(20,22,26,.05), 0 1px 1px rgba(20,22,26,.04);
  --shadow-pop: 0 8px 28px rgba(20,22,26,.14);
  --nav-w: 216px; --topbar-h: 52px; --toolbar-h: 48px;
  /* Compatibility aliases. The shell rewrite renamed these tokens; chart code
     still referenced the old names, and an undefined var() renders as nothing
     -- which is why unmapped map tiles came out black on a light surface.
     Aliasing is safer than find-and-replace across every chart. */
  --grid: var(--line-2);
  --axis: var(--line);
  --hair: var(--line);
  --ink-muted: var(--ink-3);
  --plane: var(--bg);
  --surface-1: var(--surface);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0e0f11; --surface: #17181a; --surface-2: #1c1e21;
    --sidebar: #0a0b0c; --sidebar-2: #17181a;
    --ink-1: #f2f2f0; --ink-2: #b3b8c0; --ink-3: #7c828c; --ink-inv: #16181d;
    --line: #272a2e; --line-2: #202225;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-pop: 0 10px 34px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0f11; --surface: #17181a; --surface-2: #1c1e21;
  --sidebar: #0a0b0c; --sidebar-2: #17181a;
  --ink-1: #f2f2f0; --ink-2: #b3b8c0; --ink-3: #7c828c; --ink-inv: #16181d;
  --line: #272a2e; --line-2: #202225;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-pop: 0 10px 34px rgba(0,0,0,.55);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink-1);
  font: var(--t-base)/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .92em; }

/* --- app frame ----------------------------------------------------------- */
.app { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: 100vh; }

/* --- sidebar ------------------------------------------------------------- */
.side {
  background: var(--sidebar); color: var(--ink-inv);
  display: flex; flex-direction: column; position: sticky; top: 0;
  height: 100vh; overflow: hidden;
}
/* The nav region scrolls; the brand and the footer stay pinned. Without this
   a tall nav pushes the footer past 100vh and it is clipped off the bottom. */
.side .scrollarea { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
.side .scrollarea::-webkit-scrollbar { width: 6px; }
.side .scrollarea::-webkit-scrollbar-thumb { background: #33363b; border-radius: 3px; }
.side .brand {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 0 var(--sp-4); height: var(--topbar-h); flex: none;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.side .brand { text-decoration: none; color: inherit; }
.side .brand:hover .wordmark b { color: var(--brand); }
.side .logomark { width: 26px; height: 26px; flex: none; border-radius: 6px; }
.side .wordmark { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.side .wordmark b { font-size: var(--t-base); letter-spacing: -.015em; color: #fff;
  transition: color .12s; }
.side .wordmark span { font-size: var(--t-micro); color: #6b7078;
  letter-spacing: .08em; text-transform: uppercase; }
.side .grp {
  font-size: var(--t-micro); letter-spacing: .1em; text-transform: uppercase;
  color: #6b7078; padding: var(--sp-5) var(--sp-4) var(--sp-2);
}
.side nav { display: flex; flex-direction: column; gap: 1px; padding: 0 var(--sp-2); }
.side nav button {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%;
  background: none; border: 0; cursor: pointer; text-align: left;
  padding: 8px 10px; border-radius: var(--r-sm);
  color: #a9aeb6; font-size: var(--t-base); line-height: 1.35;
}
.side nav button:hover { background: var(--sidebar-2); color: #e6e8ea; }
.side nav button[aria-current="page"] {
  background: var(--sidebar-2); color: #fff; font-weight: 600;
  box-shadow: inset 2px 0 0 var(--brand);
}
.side nav .step-unused {
  width: 20px; height: 20px; flex: none; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 650; font-variant-numeric: tabular-nums;
  background: rgba(255,255,255,.07); color: #8a9099;
}
.side nav button[aria-current="page"] .step { background: var(--brand); color: #16181d; }
.side nav .ico { width: 16px; flex: none; opacity: .85; }

/* story navigation ------------------------------------------------------- */
.storynav { display: flex; justify-content: space-between; align-items: stretch;
  gap: var(--sp-3); margin-top: var(--sp-2); }
.sn {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: var(--sp-3) var(--sp-4); cursor: pointer; text-align: left;
  box-shadow: var(--shadow); color: var(--ink-2); font-size: var(--t-sm);
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.sn:hover { border-color: var(--ink-3); color: var(--ink-1); }
.sn.next { align-items: flex-end; text-align: right; }
.sn.next { font-weight: 600; color: var(--ink-1); }
.sn .lbl { color: var(--ink-3); font-weight: 400; font-size: var(--t-cap);
  text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.sn .q { color: var(--ink-3); font-size: var(--t-cap); }
.side .foot {
  flex: none; padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid rgba(255,255,255,.07);
  font-size: var(--t-micro); color: #6b7078; line-height: 1.6;
}
.side .foot .dot { width: 6px; height: 6px; border-radius: 50%;
  background: var(--good); display: inline-block; margin-right: 6px; }

/* --- topbar -------------------------------------------------------------- */
.main-col { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); flex: none; background: var(--surface);
  border-bottom: 1px solid var(--line); display: flex; align-items: center;
  gap: var(--sp-4); padding: 0 var(--sp-5); position: sticky; top: 0; z-index: 30;
}
.crumb { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; }
.crumb h1 { margin: 0; font-size: var(--t-lg); font-weight: 650; letter-spacing: -.015em; }
.crumb .desc { font-size: var(--t-sm); color: var(--ink-3); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1 1 auto; }
.stat-inline { display: flex; align-items: center; gap: var(--sp-4);
  font-size: var(--t-sm); color: var(--ink-3); white-space: nowrap; }
.stat-inline b { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.icon-btn {
  background: none; border: 1px solid transparent; border-radius: var(--r-sm);
  padding: 5px 8px; cursor: pointer; color: var(--ink-3); font-size: var(--t-sm);
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--line); color: var(--ink-1); }

/* --- toolbar (filters) --------------------------------------------------- */
.toolbar {
  min-height: var(--toolbar-h); background: var(--surface-2);
  border-bottom: 1px solid var(--line); display: flex; align-items: center;
  gap: var(--sp-2); padding: var(--sp-2) var(--sp-5); flex-wrap: wrap;
  position: sticky; top: var(--topbar-h); z-index: 25;
}
.ctl { position: relative; }
.ctl > button {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 5px 9px; cursor: pointer;
  font-size: var(--t-sm); color: var(--ink-1); white-space: nowrap;
}
.ctl > button:hover { border-color: var(--ink-3); }
.ctl > button .cap { color: var(--ink-3); }
.ctl > button .caret { color: var(--ink-3); font-size: 9px; }
.ctl > button.on { border-color: var(--focus);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 15%, transparent); }
.menu {
  position: absolute; z-index: 60; top: calc(100% + 5px); left: 0;
  min-width: 250px; max-height: 340px; overflow: auto;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow-pop); padding: var(--sp-1);
}
.menu[hidden] { display: none; }
.menu .row {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%;
  padding: 6px 8px; border-radius: var(--r-sm); border: 0; background: none;
  cursor: pointer; text-align: left; font-size: var(--t-sm); color: var(--ink-1);
}
.menu .row:hover { background: var(--surface-2); }
.menu .row .tick { width: 14px; color: var(--focus); font-weight: 700; }
.menu .row .n { margin-left: auto; color: var(--ink-3);
  font-variant-numeric: tabular-nums; font-size: var(--t-cap); }
.menu .sep { height: 1px; background: var(--line); margin: var(--sp-1) 0; }
.menu .foot { padding: var(--sp-2); display: grid; gap: var(--sp-2); }
.menu input[type=datetime-local] {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 5px 7px; font-size: var(--t-sm);
}
.vr { width: 1px; height: 20px; background: var(--line); margin: 0 var(--sp-1); }
.rangeout { font-size: var(--t-cap); color: var(--ink-3); white-space: nowrap;
  font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
.rangeout b { color: var(--ink-2); font-weight: 600; }
.rangeout .dur { background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; padding: 1px 8px; color: var(--ink-2); }
.chips { display: flex; gap: var(--sp-1); flex-wrap: wrap; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-cap);
  background: color-mix(in srgb, var(--focus) 10%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--focus) 32%, transparent);
  color: var(--ink-1); border-radius: 999px; padding: 3px 5px 3px 9px;
}
.chip .k { color: var(--ink-3); }
.chip button { background: none; border: 0; cursor: pointer; color: var(--ink-3);
  padding: 0 2px; line-height: 1; font-size: 13px; }
.chip button:hover { color: var(--crit); }
.linkish { background: none; border: 0; cursor: pointer; color: var(--ink-2);
  font-size: var(--t-cap); text-decoration: underline; text-underline-offset: 3px; }
.linkish:hover { color: var(--ink-1); }


/* --- filter builder ------------------------------------------------------ */
#ctl-filters > button { gap: 7px; }
#ctl-filters .fico { opacity: .65; }
#ctl-filters .badge, .fhead .badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
  background: var(--focus); color: #fff; font-size: 10.5px; font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.fpanel {
  position: absolute; z-index: 70; top: calc(100% + 6px); left: 0;
  width: min(940px, calc(100vw - 60px));
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow-pop); overflow: hidden;
}
.fpanel[hidden] { display: none; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 1px; background: var(--line-2); }
.fcol { background: var(--surface); padding: var(--sp-3); min-width: 0; }
.fhead { display: flex; align-items: center; gap: 6px; font-size: var(--t-cap);
  letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3);
  font-weight: 620; margin-bottom: var(--sp-2); }
.fsearch { width: 100%; margin-bottom: var(--sp-2); padding: 5px 8px;
  border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface-2); font-size: var(--t-sm); }
.flist { max-height: 210px; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
.frow { display: flex; align-items: center; gap: 8px; width: 100%; border: 0;
  background: none; cursor: pointer; padding: 5px 6px; border-radius: var(--r-sm);
  text-align: left; font-size: var(--t-sm); color: var(--ink-1); }
.frow:hover { background: var(--surface-2); }
.frow .box { width: 13px; height: 13px; flex: none; border-radius: 3px;
  border: 1.5px solid var(--line); background: var(--surface); }
.frow .box.on { background: var(--focus); border-color: var(--focus);
  box-shadow: inset 0 0 0 2px var(--surface); }
.frow .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .n { margin-left: auto; color: var(--ink-3); font-size: var(--t-cap);
  font-variant-numeric: tabular-nums; }
.fmore { font-size: var(--t-micro); color: var(--ink-3); margin-top: 6px; }
.fpred { border-top: 1px solid var(--line); background: var(--surface-2);
  padding: var(--sp-3) var(--sp-4); }
.fpred-h { font-size: var(--t-micro); letter-spacing: .1em; color: var(--ink-3);
  margin-bottom: 4px; }
.fpred pre { margin: 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: var(--t-sm); color: var(--ink-2); white-space: pre-wrap; line-height: 1.5; }
.ffoot { display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-2) var(--sp-4); border-top: 1px solid var(--line); }
.fdone { background: var(--brand); color: var(--brand-ink); border: 1px solid rgba(0,0,0,.2);
  border-radius: var(--r-sm); padding: 5px 14px; font-weight: 620; cursor: pointer;
  font-size: var(--t-sm); }
.fdone:hover { filter: brightness(.96); }


/* --- alerts & logs -------------------------------------------------------- */
.alert { display: flex; align-items: center; gap: var(--sp-2); padding: 8px 10px;
  border-radius: var(--r-sm); border: 1px solid var(--line); margin-bottom: 6px;
  font-size: var(--t-sm); background: var(--surface-2); }
.alert.critical { border-left: 3px solid var(--crit); }
.alert.warning  { border-left: 3px solid var(--warn); }
.alert .lv { font-size: var(--t-micro); font-weight: 700; letter-spacing: .06em;
  padding: 2px 6px; border-radius: 3px; color: #fff; }
.alert.critical .lv { background: var(--crit); }
.alert.warning  .lv { background: var(--warn); color: #3a2a00; }
.alert .ttl { color: var(--ink-1); }
.alert .val { margin-left: auto; font-weight: 680; font-variant-numeric: tabular-nums; }
.alert .thr { color: var(--ink-3); font-size: var(--t-cap); white-space: nowrap; }
.ok-state { padding: var(--sp-4); text-align: center; color: var(--good);
  font-size: var(--t-sm); border: 1px dashed var(--line); border-radius: var(--r-sm); }
.logs { max-height: 330px; overflow: auto; font-family: ui-monospace, SFMono-Regular,
  Consolas, monospace; font-size: 11.5px; line-height: 1.75; }
.logline { display: flex; gap: 10px; padding: 1px 0; white-space: nowrap; }
.logline .ts { color: var(--ink-3); flex: none; }
.logline .lvl { flex: none; width: 42px; font-weight: 650; }
.logline.info  .lvl { color: var(--s1); }
.logline.warn  .lvl { color: var(--warn); }
.logline.error .lvl { color: var(--crit); }
.logline .src { flex: none; width: 62px; color: var(--ink-3); }
.logline .msg { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.logline:hover { background: var(--surface-2); }

/* --- content ------------------------------------------------------------- */
main { padding: var(--sp-5); flex: 1 1 auto; }
.grid { display: grid; gap: var(--sp-3); grid-template-columns: repeat(12, 1fr); }
.col-12{grid-column:span 12} .col-8{grid-column:span 8} .col-6{grid-column:span 6}
.col-4{grid-column:span 4}  .col-3{grid-column:span 3}
@media (max-width:1240px){ .col-3{grid-column:span 6} }
@media (max-width:980px){ .col-8,.col-6,.col-4,.col-3{grid-column:span 12} }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 0;
  display: flex; flex-direction: column;
}
.card > header {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--line-2);
}
.card > header h2 { margin: 0; font-size: var(--t-sm); font-weight: 650;
  letter-spacing: -.005em; }
.card > .body { padding: var(--sp-4); flex: 1 1 auto; min-width: 0; }
.card > .body.flush { padding: 0; }

/* Rationale lives behind an affordance, not as a paragraph in the card.
   Explanations printed at full weight next to data is what makes a dashboard
   read as documentation instead of a product. */
.info { position: relative; margin-left: auto; }
.info > button {
  width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink-3); font-size: 10px;
  cursor: pointer; line-height: 1; padding: 0;
}
.info > button:hover { color: var(--ink-1); border-color: var(--ink-3); }
.info .pop {
  position: absolute; right: 0; top: 22px; width: 320px; z-index: 50;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); box-shadow: var(--shadow-pop);
  padding: var(--sp-3); font-size: var(--t-sm); color: var(--ink-2); line-height: 1.55;
}
.info .pop[hidden] { display: none; }

/* --- stat tiles ---------------------------------------------------------- */
.tile { padding: var(--sp-4); }
.tile .label { font-size: var(--t-cap); letter-spacing: .05em; text-transform: uppercase;
  color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.tile .value { font-size: var(--t-num); font-weight: 680; letter-spacing: -.025em;
  line-height: 1.1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile .note { font-size: var(--t-cap); color: var(--ink-3); margin-top: 4px; }
.tile .value.s1 { color: var(--s1); } .tile .value.s2 { color: var(--s2); }
.tile .value.good { color: var(--good); } .tile .value.crit { color: var(--crit); }

/* --- tables -------------------------------------------------------------- */
.tablewrap { max-height: 420px; overflow: auto; border-radius: 0 0 var(--r-lg) var(--r-lg); }
table { width: 100%; border-collapse: separate; border-spacing: 0;
  font-variant-numeric: tabular-nums; font-size: var(--t-sm); }
th, td { text-align: right; padding: 7px var(--sp-3); white-space: nowrap;
  border-bottom: 1px solid var(--line-2); }
th:first-child, td:first-child { text-align: left; }
th {
  position: sticky; top: 0; z-index: 2; background: var(--surface-2);
  color: var(--ink-3); font-weight: 600; font-size: var(--t-cap);
  letter-spacing: .04em; text-transform: uppercase; cursor: pointer;
  user-select: none; border-bottom: 1px solid var(--line);
}
th:hover { color: var(--ink-1); }
tbody tr { cursor: default; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td.dim { color: var(--ink-3); }
td.strong { font-weight: 620; }


td.actcol, th.actcol { width: 1%; padding-left: 0; }
.rowfilter { opacity: 0; transition: opacity .12s; background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  font-size: var(--t-cap); color: var(--ink-2); cursor: pointer; white-space: nowrap; }
tbody tr:hover .rowfilter, .rowfilter.on { opacity: 1; }
.rowfilter:hover { border-color: var(--focus); color: var(--focus); }
.rowfilter.on { border-color: var(--focus); color: var(--focus);
  background: color-mix(in srgb, var(--focus) 10%, var(--surface)); }
tbody tr.rowon { background: color-mix(in srgb, var(--focus) 7%, transparent); }


/* --- log viewer ----------------------------------------------------------- */
.logs { max-height: 420px; overflow: auto; font-size: var(--t-sm); }
.logrow { border-bottom: 1px solid var(--line-2); }
.logrow:last-child { border-bottom: 0; }
.lhead { display: grid; align-items: baseline; gap: 10px; padding: 5px 4px;
  grid-template-columns: 132px 46px 62px 92px 1fr auto auto; }
.logrow:hover .lhead { background: var(--surface-2); }
.lhead .ts { color: var(--ink-3); font-family: ui-monospace, monospace; font-size: 12px; }
.lhead .lvl { font-weight: 700; font-size: var(--t-micro); letter-spacing: .05em; }
.logrow.info  .lvl { color: var(--s1); }
.logrow.warn  .lvl { color: var(--warn); }
.logrow.error .lvl { color: var(--crit); }
.lhead .src { color: var(--ink-3); font-size: var(--t-cap); }
.lhead .evt { font-weight: 600; color: var(--ink-1); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.lhead .sum { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.lhead .where { color: var(--ink-3); font-family: ui-monospace, monospace;
  font-size: 10.5px; white-space: nowrap; }
.lhead .chev { color: var(--ink-3); transition: transform .12s; }
.logrow.open .lhead .chev { transform: rotate(90deg); display: inline-block; }
.ldetail { padding: 4px 4px 10px 132px; background: var(--surface-2); }
table.kv { width: auto; border-collapse: collapse; }
table.kv td { border: 0; padding: 2px 14px 2px 0; text-align: left; white-space: normal; }
table.kv td.k { color: var(--ink-3); font-family: ui-monospace, monospace;
  font-size: 11px; vertical-align: top; }
table.kv td.v { color: var(--ink-1); font-family: ui-monospace, monospace;
  font-size: 11px; word-break: break-all; }


.lhead { display: grid; align-items: baseline; gap: 10px; padding: 5px 6px;
  grid-template-columns: 12px 132px 46px 58px 92px 1fr auto auto; cursor: pointer; }
.lhead .nf { color: var(--ink-3); font-size: var(--t-micro); white-space: nowrap; }
.codehead { display: flex; align-items: center; justify-content: space-between;
  padding: 6px 10px; background: var(--surface); border: 1px solid var(--line);
  border-bottom: 0; border-radius: var(--r-sm) var(--r-sm) 0 0;
  font-size: var(--t-micro); letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3); }
.copybtn { background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 2px 9px; font-size: var(--t-cap);
  color: var(--ink-2); cursor: pointer; text-transform: none; letter-spacing: 0; }
.copybtn:hover { border-color: var(--focus); color: var(--focus); }
pre.code { margin: 0 0 10px; padding: 12px 14px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 0 0 var(--r-sm) var(--r-sm);
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px;
  line-height: 1.6; color: var(--ink-1); max-height: 340px; overflow: auto;
  /* pre-wrap, not pre: a long value must wrap rather than force the whole
     card into a horizontal scroll. tab-size keeps the two-space indent even
     if a value itself contains a tab. */
  white-space: pre-wrap; word-break: break-word; tab-size: 2; }
.ldetail { padding: 8px 6px 4px 24px; }


/* --- pagination bar (shared by logs, alerts, tables) --------------------- */
.logbar { display: flex; align-items: center; gap: 6px; padding: 0 0 8px;
  border-bottom: 1px solid var(--line-2); margin-bottom: 8px; }
.logbar .grow { flex: 1; }
.ltab { background: none; border: 1px solid transparent; border-radius: 999px;
  padding: 2px 10px; font-size: var(--t-cap); color: var(--ink-3); cursor: pointer; }
.ltab:hover { color: var(--ink-1); }
.ltab.on { background: var(--surface-2); border-color: var(--line); color: var(--ink-1);
  font-weight: 600; }
.pageinfo { font-size: var(--t-cap); color: var(--ink-3);
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.pg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
  width: 24px; height: 22px; cursor: pointer; color: var(--ink-2); line-height: 1; }
.pg:hover:not(:disabled) { border-color: var(--focus); color: var(--focus); }
.pg:disabled { opacity: .35; cursor: default; }
.acount { font-size: var(--t-cap); color: var(--ink-3); }
/* --- rejects bars -------------------------------------------------------- */
.rejrow { display: grid; grid-template-columns: 120px 1fr auto; gap: 10px;
  align-items: center; padding: 4px 0; font-size: var(--t-sm); }
.rejrow .rlbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.rejrow .rbar { height: 9px; background: var(--line-2); border-radius: 5px; overflow: hidden; }
.rejrow .rbar span { display: block; height: 100%; background: var(--warn); }
.rejrow .rval { font-variant-numeric: tabular-nums; color: var(--ink-1); font-weight: 600; }


.pager { display: flex; align-items: center; justify-content: center; gap: var(--sp-3);
  padding: 10px 0 2px; border-top: 1px solid var(--line-2); margin-top: 8px; }
.pgbtn { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 5px 14px; font-size: var(--t-sm);
  color: var(--ink-1); cursor: pointer; font-weight: 550; }
.pgbtn:hover:not(:disabled) { border-color: var(--focus); color: var(--focus);
  background: color-mix(in srgb, var(--focus) 6%, var(--surface)); }
.pgbtn:disabled { opacity: .38; cursor: default; }
.pgnum { font-size: var(--t-sm); color: var(--ink-2); font-variant-numeric: tabular-nums;
  min-width: 110px; text-align: center; }


/* --- motion ---------------------------------------------------------------
   Entrance animation is staggered so the eye lands on the stat tiles first
   and the charts resolve after, rather than everything appearing at once.
   All of it is disabled under prefers-reduced-motion. */
@keyframes riseIn { from { opacity: 0; transform: translateY(6px); }
                    to   { opacity: 1; transform: none; } }
main .card { animation: riseIn .32s cubic-bezier(.2,.7,.3,1) both; }
main .card:nth-child(1){animation-delay:.00s} main .card:nth-child(2){animation-delay:.03s}
main .card:nth-child(3){animation-delay:.06s} main .card:nth-child(4){animation-delay:.09s}
main .card:nth-child(5){animation-delay:.12s} main .card:nth-child(6){animation-delay:.15s}
main .card:nth-child(7){animation-delay:.18s} main .card:nth-child(8){animation-delay:.21s}
main .card:nth-child(n+9){animation-delay:.24s}

/* Line charts draw themselves in; the eye follows the curve left to right,
   which is the direction the data is read anyway. */
@keyframes drawLine { to { stroke-dashoffset: 0; } }
svg path.animline { stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: drawLine .85s ease-out forwards; }

/* Bars grow from the baseline rather than popping in at full height. */
@keyframes growW { from { transform: scaleX(0); } to { transform: scaleX(1); } }
svg g.bar rect + rect, .rejrow .rbar span {
  transform-origin: left center; animation: growW .5s cubic-bezier(.2,.7,.3,1) both; }
.stackbar .seg { transform-origin: left center;
  animation: growW .55s cubic-bezier(.2,.7,.3,1) both; }

/* Value tiles settle rather than snapping. */
.tile .value { transition: color .2s; }

@media (prefers-reduced-motion: reduce) {
  main .card, svg path.animline, svg g.bar rect + rect,
  .rejrow .rbar span, .stackbar .seg { animation: none !important; }
  svg path.animline { stroke-dasharray: none; stroke-dashoffset: 0; }
}


/* --- configuration -------------------------------------------------------- */
.cfgrow { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-3); }
.cfginput { flex: 1; padding: 7px 10px; border: 1px solid var(--line);
  border-radius: var(--r-sm); background: var(--surface-2);
  font-family: ui-monospace, monospace; font-size: var(--t-sm); }
.cfginput:focus { border-color: var(--focus); outline: none; }
.verdict { padding: 8px 12px; border-radius: var(--r-sm); font-size: var(--t-sm);
  font-weight: 600; margin-bottom: var(--sp-3); }
.verdict.ok  { background: color-mix(in srgb, var(--good) 12%, var(--surface));
  color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
.verdict.bad { background: color-mix(in srgb, var(--crit) 12%, var(--surface));
  color: var(--crit); border: 1px solid color-mix(in srgb, var(--crit) 35%, transparent); }
.plangrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: var(--sp-4); }
.plangrid h4 { margin: 0 0 6px; font-size: var(--t-cap); text-transform: uppercase;
  letter-spacing: .06em; color: var(--ink-3); }
.plist { list-style: none; margin: 0; padding: 0; font-size: var(--t-sm); }
.plist li { padding: 2px 0; color: var(--ink-2); }
.plist .muted { color: var(--ink-3); }
table.kv2 { width: 100%; table-layout: fixed; }
table.kv2 td { border: 0; padding: 4px 0; text-align: left; }
table.kv2 td.k { color: var(--ink-3); font-size: var(--t-sm); width: 45%; }
table.kv2 td.v { color: var(--ink-1); font-size: var(--t-sm);
  font-family: ui-monospace, monospace; word-break: break-all;
  overflow-wrap: anywhere; white-space: normal; }
.faultlist { max-height: 300px; overflow: auto; }
.fitem { display: grid; grid-template-columns: 132px 1fr; gap: 10px; padding: 3px 0;
  font-size: var(--t-cap); align-items: baseline; }
.fitem code { color: var(--s1); }
.fitem span { color: var(--ink-3); }
.cmdblock { margin-bottom: var(--sp-3); }
.cmdlabel { font-size: var(--t-cap); color: var(--ink-3); margin-bottom: 4px; }
.cmdrow { display: flex; align-items: center; gap: var(--sp-2);
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 8px 10px; }
.cmdrow code { flex: 1; font-size: var(--t-sm); color: var(--ink-1);
  overflow-x: auto; white-space: nowrap; background: none; border: 0; padding: 0; }

/* --- pipeline run, launched from the product ------------------------------ */
.runhead { display: flex; align-items: center; gap: var(--sp-2);
  margin-bottom: var(--sp-2); flex-wrap: wrap; }
.runhead code { font-size: var(--t-sm); color: var(--ink-1); }
.runhead .muted { color: var(--ink-3); font-size: var(--t-cap); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: var(--t-cap); font-weight: 600; }
.pill.run { background: color-mix(in srgb, var(--s1) 14%, var(--surface));
  color: var(--s1); border: 1px solid color-mix(in srgb, var(--s1) 35%, transparent); }
.pill.ok  { background: color-mix(in srgb, var(--good) 14%, var(--surface));
  color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 35%, transparent); }
.pill.bad { background: color-mix(in srgb, var(--crit) 14%, var(--surface));
  color: var(--crit); border: 1px solid color-mix(in srgb, var(--crit) 35%, transparent); }
table.runprov { margin: var(--sp-2) 0; }
table.runprov th { text-align: left; font-size: var(--t-cap); color: var(--ink-3);
  font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
  padding: 2px 8px 2px 0; border: 0; }
table.runprov td { padding: 3px 8px 3px 0; font-size: var(--t-sm); border: 0; }
table.runprov td.num { font-variant-numeric: tabular-nums; }
table.runprov td.dim { color: var(--ink-3); }
.runlog { margin-top: var(--sp-3); max-height: 320px; overflow: auto;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 10px 12px;
  font-family: ui-monospace, monospace; font-size: var(--t-cap);
  line-height: 1.55; color: var(--ink-2); white-space: pre-wrap;
  overflow-wrap: anywhere; }


/* --- overflow containment -------------------------------------------------
   Nothing may render outside its card. Flex and grid children default to
   min-width:auto, which lets a long unbroken token (a session id, a file
   path, a category name) push a track wider than its container instead of
   shrinking -- so every track that holds text gets min-width:0 explicitly.
   Popovers are deliberately NOT clipped: they are meant to escape the card. */
.card { overflow: visible; min-width: 0; }
.card > .body { min-width: 0; overflow-wrap: anywhere; }
.card > header { min-width: 0; }
.card > header h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }

/* single-line labels truncate rather than escape */
.lhead > span, .alert .ttl, .fitem code, .fitem span, .rejrow .rlbl,
.chip b, .chip .k, .crumb .desc, .stat-inline, .side nav button span,
.side .wordmark b, .side .wordmark span, .plist li, .cmdlabel {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.plist li { white-space: normal; overflow-wrap: anywhere; }
.alert { min-width: 0; }
.alert .ttl { flex: 1 1 auto; }
.tile .label, .tile .note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .value { overflow-wrap: anywhere; }

/* wide content scrolls INSIDE its own box, never widening the page */
.tablewrap { max-width: 100%; overflow: auto; }
table { min-width: 0; }
td, th { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
table.kv2 td, table.kv td { max-width: none; overflow: visible;
  text-overflow: clip; }
.cmdrow { min-width: 0; }
.cmdrow code { min-width: 0; }
.logs { max-width: 100%; }
pre.code { max-width: 100%; }
.fpanel { max-width: calc(100vw - 60px); }
.flist { min-width: 0; }
.frow .lbl { min-width: 0; }
main, .main-col { min-width: 0; overflow-x: hidden; }
.grid > * { min-width: 0; }
svg { max-width: 100%; }


/* --- responsive -----------------------------------------------------------
   The shell assumed one screen. Three things change with width: the sidebar
   narrows then collapses behind a toggle, the grid reflows at sensible
   breakpoints rather than jumping straight to one column, and content stops
   stretching on ultrawide displays where a 3000px-wide chart is unreadable. */
main > .grid { max-width: 1680px; margin: 0 auto; }

@media (max-width: 1400px) {
  :root { --nav-w: 196px; }
}
@media (max-width: 1180px) {
  .col-8 { grid-column: span 12; }
  .col-7, .col-5 { grid-column: span 6; }
  .col-3 { grid-column: span 6; }
}
@media (max-width: 900px) {
  :root { --nav-w: 0px; }
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; left: 0; top: 0; width: 216px; z-index: 80;
    transform: translateX(-100%); transition: transform .18s ease; }
  .side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  #navtoggle { display: inline-flex !important; }
  .col-7, .col-5, .col-6, .col-4, .col-3 { grid-column: span 12; }
  .topbar { padding: 0 var(--sp-4); gap: var(--sp-2); }
  .crumb .desc { display: none; }
  .stat-inline { display: none; }
  main { padding: var(--sp-4); }
  .toolbar { padding: var(--sp-2) var(--sp-4); }
  .fpanel { width: calc(100vw - 32px); }
  .lhead { grid-template-columns: 12px 1fr auto; }
  .lhead .src, .lhead .where, .lhead .nf, .lhead .lvl { display: none; }
}
@media (max-width: 600px) {
  .tile .value { font-size: 24px; }
  .rangeout { display: none; }
  .logbar { flex-wrap: wrap; }
}
#navtoggle { display: none; align-items: center; justify-content: center;
  width: 30px; height: 28px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--surface); cursor: pointer; color: var(--ink-2); flex: none; }
#navscrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 79; }
#navscrim[hidden] { display: none; }


/* --- dataset contracts ---------------------------------------------------- */
.dsgrid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); }
@media (max-width: 1100px) { .dsgrid { grid-template-columns: 1fr; } }
.dscard { border: 1px solid var(--line); border-radius: var(--r); padding: var(--sp-4);
  background: var(--surface-2); min-width: 0; }
.dscard.fact { border-left: 3px solid var(--s1); }
.dscard.dim  { border-left: 3px solid var(--s3); }
.dshead { display: flex; align-items: baseline; gap: var(--sp-2); flex-wrap: wrap;
  margin-bottom: var(--sp-3); }
.dsrole { font-size: var(--t-cap); letter-spacing: .06em; text-transform: uppercase;
  font-weight: 700; }
.dscard.fact .dsrole { color: var(--s1); }
.dscard.dim  .dsrole { color: var(--s3); }
.dstable { font-size: var(--t-sm); color: var(--ink-1); }
.dsrows { margin-left: auto; font-size: var(--t-cap); color: var(--ink-3);
  font-variant-numeric: tabular-nums; }
.dsans-h { font-size: var(--t-micro); letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 5px; }
.dsans ul { margin: 0 0 var(--sp-3); padding-left: 18px; }
.dsans li { font-size: var(--t-sm); color: var(--ink-1); margin: 3px 0; }
.fieldlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 2px 12px; max-height: 190px; overflow: auto; margin-bottom: var(--sp-3); }
.fld { display: flex; gap: 7px; align-items: baseline; font-size: var(--t-cap);
  min-width: 0; }
.fld code { color: var(--ink-1); }
.fld span { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; }
.dsmeta { border-top: 1px solid var(--line); padding-top: var(--sp-2);
  font-size: var(--t-cap); color: var(--ink-2); display: grid; gap: 4px; }
.dsmeta b { color: var(--ink-3); font-weight: 600; margin-right: 5px; }
.dswhy { color: var(--ink-3); line-height: 1.55; margin-top: 3px; }
/* --- lineage -------------------------------------------------------------- */
.lin { display: grid; gap: 0; }
.linstep { min-width: 0; }
.linrow { display: flex; align-items: center; gap: var(--sp-2); }
.lindot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); flex: none; }
.linstep.fact .lindot { background: var(--s1); }
.linstep.dim .lindot { background: var(--s3); }
.linstep.derived .lindot { background: var(--s4); }
.linstep.serve .lindot { background: var(--brand); box-shadow: 0 0 0 1px var(--line); }
.linlabel { font-size: var(--t-sm); color: var(--ink-1); font-weight: 600; }
.linkind { font-size: var(--t-micro); letter-spacing: .07em; text-transform: uppercase;
  color: var(--ink-3); border: 1px solid var(--line); border-radius: 999px; padding: 1px 7px; }
.linvia { font-size: var(--t-cap); color: var(--ink-3); margin: 2px 0 0 18px; }
.linarrow { color: var(--ink-3); margin: 2px 0 2px 2px; font-size: 13px; line-height: 1.1; }


.rpstat { display: flex; align-items: center; gap: 9px; font-size: var(--t-sm);
  font-weight: 600; padding: 8px 11px; border-radius: var(--r-sm);
  margin-bottom: var(--sp-3); border: 1px solid var(--line); }
.rpstat.live { color: var(--good);
  background: color-mix(in srgb, var(--good) 10%, var(--surface));
  border-color: color-mix(in srgb, var(--good) 32%, transparent); }
.rpstat.idle { color: var(--ink-3); background: var(--surface-2); }
.rpdot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.rpstat.live .rpdot { animation: pulse2 1.6s infinite; }
@keyframes pulse2 { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

/* --- states -------------------------------------------------------------- */
.skel { background: linear-gradient(90deg, var(--line-2) 25%, var(--surface-2) 37%,
  var(--line-2) 63%); background-size: 400% 100%;
  animation: sh 1.3s ease-in-out infinite; border-radius: var(--r-sm); }
@keyframes sh { 0%{background-position:100% 0} 100%{background-position:0 0} }
.skel-line { height: 11px; margin: 7px 0; }
.empty { padding: var(--sp-5); text-align: center; color: var(--ink-3);
  font-size: var(--t-sm); border: 1px dashed var(--line-2);
  border-radius: var(--r-sm); }
.card > .body:empty { display: none; }
.card:has(> .body:empty) { display: none; }
.err { color: var(--crit); font-size: var(--t-sm); }
.loading { opacity: .55; transition: opacity .15s; }

/* --- misc ---------------------------------------------------------------- */
.legend { display: flex; gap: var(--sp-4); flex-wrap: wrap; font-size: var(--t-cap);
  color: var(--ink-2); margin-bottom: var(--sp-3); }
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .swatch { width: 13px; height: 3px; border-radius: 2px; }
.legend .swatch.box { width: 10px; height: 10px; border-radius: 2px; }
.stackbar { display: flex; height: 26px; border-radius: 5px; overflow: hidden; gap: 2px; }
.stackbar .seg { transition: opacity .15s; }
.stackbar .seg:hover { opacity: .78; }
.col-7{grid-column:span 7} .col-5{grid-column:span 5}
@media (max-width:980px){ .col-7,.col-5{grid-column:span 12} }
.note-inline { color: var(--ink-3); font-size: var(--t-cap); line-height: 1.6;
  margin: var(--sp-3) 0 0; }
.tag { display: inline-block; font-size: var(--t-micro); padding: 2px 7px;
  border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2);
  background: var(--surface-2); }
.tag.on { border-color: var(--s1); color: var(--s1); }
.tag.off { border-color: var(--line); color: var(--ink-3); }
svg { display: block; width: 100%; overflow: visible; }
.tip {
  position: fixed; z-index: 90; pointer-events: none; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-pop); padding: var(--sp-2) var(--sp-3);
  font-size: var(--t-sm); min-width: 165px;
}
.tip[hidden] { display: none; }

.tip .r { display: flex; align-items: center; gap: var(--sp-2); }
.tip .r .k { width: 12px; height: 2px; border-radius: 2px; flex: none; }
.tip .r .v { font-weight: 680; font-variant-numeric: tabular-nums; }
.tip .r .n { color: var(--ink-2); margin-left: auto; font-size: var(--t-cap); }
</style>

<script>
"use strict";
const $ = s => document.querySelector(s);
const fmt = n => n == null ? "--" : n.toLocaleString();
const fmt1 = n => n == null ? "--" : n.toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});

/* --- dashboards. Each is a role, not a feature dump. -------------------- */
/* The dashboards are a STORY, not a menu. Each step answers the question the
   previous step raises, and the sidebar numbers them so a first-time reader
   knows there is an order and where they are in it. */
const TABS = [
  {id:"replay",   grp:"Monitor", name:"Replay",
   desc:"Ingest a live-event day and watch the concurrency curve build"},
  {id:"ingest",   grp:"Monitor", name:"Ingestion",
   desc:"Pipeline flow, insert batches, alerts and logs"},
  {id:"liveops",  grp:"Monitor", name:"Live Operations",
   desc:"Stream health during an event: churn, rebuffering, errors, ingest lag"},
  {id:"overview", grp:"Metrics", name:"Concurrency",
   desc:"Active concurrent sessions vs the session-overlap baseline"},
  {id:"ops",      grp:"Metrics", name:"Session Health",
   desc:"Termination causes and inferred-vs-observed session closes"},
  {id:"analyst",  grp:"Metrics", name:"Content",
   desc:"Peak simultaneous viewers by title and category"},
  {id:"product",  grp:"Metrics", name:"Audience",
   desc:"Watch time and engagement by platform"},
  {id:"regions",  grp:"Metrics", name:"Languages",
   desc:"Audio-language distribution and regional coverage"},
  {id:"live",     grp:"Traces",  name:"Ingestion",
   desc:"Stream throughput, consumer lag, dead letter queue, schema registry"},
  {id:"pipeline", grp:"Traces",  name:"Storage",
   desc:"Serving-layer footprint and query cost"},
  {id:"config",   grp:"Traces",  name:"Configuration",
   desc:"Dataset, resolved schema, and the automation behind it"},
  {id:"arch",     grp:"Traces",  name:"Architecture",
   desc:"Component topology and SQL console"},
];

// Populated from /api/overview. Hardcoding the dimension list here is how the
// UI ended up offering filters the backend could not honour.
let DIMS = [];
const DIM_LABEL = {platform:"Platform", video_type:"Type", category:"Category",
                   close_reason:"Close reason", country:"Country"};

const state = {
  tab: location.hash.slice(1) || "overview",
  from: null, to: null, preset: "day",
  sel: {platform:[], video_type:[], category:[], close_reason:[]},
  sort: {col:"sessions", dir:-1},
};
let OV = null, FACETS = null, openMenu = null;

/* --- query string shared by every request, so numbers always agree ------ */
function qs(extra) {
  const p = new URLSearchParams();
  if (state.from) p.set("from", state.from);
  if (state.to)   p.set("to", state.to);
  for (const d of DIMS) if (state.sel[d.key].length) p.set(d.key, state.sel[d.key].join(","));
  for (const k in (extra||{})) p.set(k, extra[k]);
  return p.toString();
}
async function api(path, extra) {
  // Renders are async and the user can switch views mid-flight. A superseded
  // render must not write its answers into the view that replaced it, so
  // every api() call remembers which render generation it belongs to and
  // aborts on resolution if the world moved on. The view function throws at
  // its next await instead of scribbling on someone else's DOM.
  const born = seq;
  const r = await fetch(path + "?" + qs(extra));
  const j = await r.json();
  if (born !== seq) throw new Error("__stale_render__");
  if (j.error) throw new Error(j.error);
  return j;
}

/* =======================================================================
   Charts. Vanilla SVG: no CDN, no npm -- venue wi-fi cannot break this.
   ======================================================================= */
const tip = $("#tip");
function showTip(x, y, html) {
  tip.innerHTML = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x + 14, innerWidth - r.width - 8) + "px";
  tip.style.top  = Math.min(y + 14, innerHeight - r.height - 8) + "px";
}
const hideTip = () => { tip.hidden = true; };
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };

/* Dual-line concurrency chart with the gap between the curves filled.
   The fill IS the message: audience an open-app model would have reported. */
function chartConcurrency(host, d) {
  const W = host.clientWidth || 900, H = 300;
  const m = {t:10, r:14, b:24, l:52};
  const fg = d.foreground, nv = d.naive;
  if (!fg.length) { host.innerHTML = '<p class="note-inline">no data in this slice</p>'; return; }
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxY = Math.max(1, ...nv.map(p=>p[1]), ...fg.map(p=>p[1]));
  const n = fg.length;
  const X = i => m.l + (n<2 ? iw/2 : i/(n-1)*iw);
  const Y = v => m.t + ih - (v/maxY)*ih;
  const path = pts => pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  // gap band: naive on top, foreground back along the bottom
  const band = path(nv) + " " + fg.map((p,i)=>"L"+X(n-1-i).toFixed(1)+" "+Y(fg[n-1-i][1]).toFixed(1)).join(" ") + " Z";
  const ticks = 4, gl = [], yl = [];
  for (let i=0;i<=ticks;i++){ const v = maxY*i/ticks, y = Y(v);
    gl.push(`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`);
    yl.push(`<text x="${m.l-8}" y="${y+4}" text-anchor="end" fill="var(--ink-muted)" font-size="11">${fmt(Math.round(v))}</text>`); }
  const xl = [];
  for (let i=0;i<=3;i++){ const idx = Math.round(i/3*(n-1));
    xl.push(`<text x="${X(idx)}" y="${H-6}" text-anchor="${i===0?"start":i===3?"end":"middle"}" fill="var(--ink-muted)" font-size="11">${esc(fg[idx][0].slice(5,16))}</text>`); }
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="concurrency over time">
    ${gl.join("")}${yl.join("")}${xl.join("")}
    <path d="${band}" fill="var(--s2)" opacity=".14"/>
    <path class="animline" pathLength="1" d="${path(nv)}" fill="none" stroke="var(--s2)"
          stroke-width="2" stroke-linejoin="round"/>
    <path class="animline" pathLength="1" style="animation-delay:.12s" d="${path(fg)}"
          fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
    <line id="cross" y1="${m.t}" y2="${m.t+ih}" stroke="var(--axis)" stroke-width="1" style="display:none"/>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>
  </svg>`;
  const svg = host.querySelector("svg"), cross = host.querySelector("#cross");
  host.querySelector("#hit").addEventListener("pointermove", ev => {
    const bb = svg.getBoundingClientRect();
    const px = (ev.clientX - bb.left) / bb.width * W;
    let i = Math.round((px - m.l) / (iw || 1) * (n-1));
    i = Math.max(0, Math.min(n-1, i));
    cross.style.display = ""; cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i));
    const a = nv[i] ? nv[i][1] : 0, b = fg[i][1];
    showTip(ev.clientX, ev.clientY, `<div class="when">${esc(fg[i][0])} UTC</div>
      <div class="r"><span class="k" style="background:var(--s2)"></span><span class="v">${fmt(a)}</span><span class="n">naive</span></div>
      <div class="r"><span class="k" style="background:var(--s1)"></span><span class="v">${fmt(b)}</span><span class="n">foreground-only</span></div>
      <div class="r"><span class="k" style="background:transparent"></span><span class="v">${fmt(a-b)}</span><span class="n">over-reported</span></div>`);
  });
  host.querySelector("#hit").addEventListener("pointerleave", () => { hideTip(); cross.style.display="none"; });
}

/* Horizontal bars: magnitude by identity. Click a bar to narrow. */
function chartBars(host, rows, valKey, dimKey, colorVar) {
  if (!rows.length) { host.innerHTML = '<p class="note-inline">nothing in this slice</p>'; return; }
  const top = rows.slice(0, 10);
  const max = Math.max(...top.map(r => r[valKey] || 0), 1);
  const rowH = 26, W = host.clientWidth || 480, labelW = Math.min(190, W*0.42);
  const H = top.length * rowH;
  const bars = top.map((r, i) => {
    const w = Math.max(2, (r[valKey]||0)/max * (W - labelW - 62));
    const y = i*rowH + 5;
    return `<g class="bar" data-v="${esc(String(r.value))}" tabindex="0">
      <rect x="0" y="${y-5}" width="${W}" height="${rowH-2}" fill="transparent"/>
      <text x="0" y="${y+11}" fill="var(--ink-2)" font-size="12">${esc(String(r.value).slice(0,28))}</text>
      <rect x="${labelW}" y="${y}" width="${w}" height="${rowH-12}" rx="4" fill="var(${colorVar})"/>
      <text x="${labelW+w+8}" y="${y+11}" fill="var(--ink-2)" font-size="12" font-variant-numeric="tabular-nums">${fmt(r[valKey])}</text>
    </g>`;
  }).join("");
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img">${bars}</svg>`;
  host.querySelectorAll(".bar").forEach(g => {
    g.style.cursor = "pointer";
    g.addEventListener("click", () => toggleFilter(dimKey, g.dataset.v));
    g.addEventListener("pointermove", ev => {
      const r = top.find(t => String(t.value) === g.dataset.v);
      showTip(ev.clientX, ev.clientY,
        `<div class="when">${esc(String(r.value))}</div>
         <div class="r"><span class="k" style="background:var(${colorVar})"></span><span class="v">${fmt(r[valKey])}</span><span class="n">${esc(valKey.replace(/_/g," "))}</span></div>
         <div class="r"><span class="k" style="background:transparent"></span><span class="v">${fmt(r.sessions)}</span><span class="n">sessions</span></div>
         <div class="note-inline">click to filter</div>`);
    });
    g.addEventListener("pointerleave", hideTip);
  });
}

/* Sequential ramp (one hue, light->dark) for magnitude. Never a rainbow. */
const RAMP = ["#cde2fb","#9ec5f4","#6da7ec","#3987e5","#2a78d6","#1c5cab","#104281"];
const rampFor = (v, max) => RAMP[Math.min(RAMP.length-1,
  Math.max(0, Math.round((max ? v/max : 0) ** 0.55 * (RAMP.length-1))))];

/* Heatmap: date x hour-of-day. A cell with no delta is NOT zero -- it means
   no change was recorded, so it renders as absent rather than as "nobody". */
function chartHeatmap(host, cells) {
  if (!cells.length) { host.innerHTML = '<p class="note-inline">no data</p>'; return; }
  const dates = [...new Set(cells.map(c=>c.date))].sort();
  const max = Math.max(...cells.map(c=>c.peak));
  const by = new Map(cells.map(c=>[c.date+"|"+c.hour, c.peak]));
  const W = host.clientWidth || 900, labelW = 82, cw = (W-labelW)/24, ch_ = 20;
  const H = dates.length*ch_ + 20;
  let s = "";
  for (let h=0; h<24; h+=3)
    s += `<text x="${labelW+h*cw}" y="12" fill="var(--ink-muted)" font-size="10">${String(h).padStart(2,"0")}</text>`;
  dates.forEach((d,r) => {
    s += `<text x="0" y="${20+r*ch_+14}" fill="var(--ink-muted)" font-size="11">${esc(d.slice(5))}</text>`;
    for (let h=0; h<24; h++) {
      const v = by.get(d+"|"+h);
      const fill = v == null ? "var(--grid)" : rampFor(v, max);
      s += `<rect class="cell" data-d="${d}" data-h="${h}" data-v="${v==null?"":v}"
        x="${labelW+h*cw+1}" y="${20+r*ch_+1}" width="${Math.max(1,cw-2)}" height="${ch_-2}"
        rx="2" fill="${fill}"/>`;
    }
  });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="peak concurrency by hour">${s}</svg>
    <div class="legend" style="margin-top:8px">
      <span class="key">low</span>
      ${RAMP.map(c=>`<span class="swatch box" style="background:${c}"></span>`).join("")}
      <span class="key">${fmt(max)} peak</span>
      <span class="key"><span class="swatch box" style="background:var(--grid)"></span>no delta recorded</span>
    </div>`;
  host.querySelectorAll(".cell").forEach(c => {
    c.addEventListener("pointermove", ev => showTip(ev.clientX, ev.clientY,
      `<div class="when">${esc(c.dataset.d)} ${String(c.dataset.h).padStart(2,"0")}:00 UTC</div>
       <div class="r"><span class="k" style="background:${c.getAttribute("fill")}"></span>
       <span class="v">${c.dataset.v === "" ? "no delta" : fmt(+c.dataset.v)}</span>
       <span class="n">peak concurrency</span></div>`));
    c.addEventListener("pointerleave", hideTip);
  });
}

/* India tile cartogram. One square per state, geographically arranged.
   Deliberately schematic: we have NO state-level data. States are shaded by
   the session count of the language they predominantly speak, which is an
   inference, not a measurement -- the card says so, loudly. */
const IN_TILES = [
  ["JK",2,0],["LA",3,0],
  ["PB",2,1],["HP",3,1],["UK",4,1],
  ["RJ",1,2],["HR",2,2],["DL",3,2],["UP",4,2],["BR",5,2],["SK",6,2],["AR",7,2],
  ["GJ",0,3],["MP",2,3],["JH",4,3],["WB",5,3],["AS",6,3],["NL",7,3],
  ["MH",1,4],["CG",3,4],["OD",4,4],["ML",5,4],["MN",6,4],["TR",7,4],
  ["GA",1,5],["KA",2,5],["TS",3,5],["AP",4,5],["MZ",5,5],
  ["KL",2,6],["TN",3,6],["PY",4,6],
];
const LANG_STATES = {
  Hindi:["UP","BR","MP","RJ","HR","DL","JH","CG","UK","HP"],
  Marathi:["MH"], Bengali:["WB","TR"], Malayalam:["KL"],
  Tamil:["TN","PY"], Telugu:["TS","AP"], Kannada:["KA"],
};
function chartTileMap(host, rows) {
  const byLang = Object.fromEntries(rows.map(r=>[r.value, r.sessions]));
  const stateLang = {};
  for (const [lang, sts] of Object.entries(LANG_STATES))
    for (const st of sts) stateLang[st] = lang;
  const mapped = Object.values(LANG_STATES).flat();
  const vals = mapped.map(st => byLang[stateLang[st]] || 0);
  const max = Math.max(1, ...vals);
  const size = 40, gap = 4, cols = 8, rowsN = 7;
  const W = cols*(size+gap), H = rowsN*(size+gap);
  const tiles = IN_TILES.map(([st,c,r]) => {
    const lang = stateLang[st], v = lang ? (byLang[lang]||0) : null;
    const fill = v == null ? "var(--grid)" : rampFor(v, max);
    const ink = (v != null && v/max > .55) ? "#fff" : "var(--ink-2)";
    return `<g class="tile-st" data-st="${st}" data-lang="${lang||""}" data-v="${v==null?"":v}">
      <rect x="${c*(size+gap)}" y="${r*(size+gap)}" width="${size}" height="${size}"
            rx="4" fill="${fill}"/>
      <text x="${c*(size+gap)+size/2}" y="${r*(size+gap)+size/2+4}" text-anchor="middle"
            font-size="11" fill="${ink}">${st}</text></g>`;
  }).join("");
  const unmapped = (byLang["Not stated"]||0) + (byLang["English"]||0) + (byLang["Other"]||0);
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="max-width:${W}px" role="img"
      aria-label="Indian states shaded by predominant language">${tiles}</svg>
    <p class="note-inline">Inferred from audio language ·
      <b>${fmt(unmapped)}</b> sessions not placeable</p>`;
  host.querySelectorAll(".tile-st").forEach(g => {
    g.addEventListener("pointermove", ev => showTip(ev.clientX, ev.clientY,
      `<div class="when">${esc(g.dataset.st)}</div>` + (g.dataset.lang
        ? `<div class="r"><span class="k" style="background:var(--s1)"></span>
             <span class="v">${fmt(+g.dataset.v)}</span><span class="n">${esc(g.dataset.lang)} sessions</span></div>
           <div class="note-inline">language-level figure, shared by every ${esc(g.dataset.lang)} state</div>`
        : `<div class="note-inline">no language in the data maps here</div>`)));
    g.addEventListener("pointerleave", hideTip);
  });
}

/* Sortable table -- the rows behind the curve, and the keyboard path to
   every value a tooltip shows. */
const TABLE_PAGE = 15;
const _tablePage = new Map();     // keyed by host element id, so pages survive re-render

function renderTable(host, rows, cols, dimKey) {
  const key = host.id || "t";
  const st = state.sort;
  const sorted = rows.slice().sort((x, y) => {
    const p = x[st.col], q = y[st.col];
    if (p == null) return 1;
    if (q == null) return -1;
    return (typeof p === "string" ? p.localeCompare(q) : p - q) * st.dir;
  });
  const pages = Math.max(1, Math.ceil(sorted.length / TABLE_PAGE));
  let page = _tablePage.get(key) || 0;
  if (page >= pages) { page = pages - 1; _tablePage.set(key, page); }
  const start = page * TABLE_PAGE;
  const slice = sorted.slice(start, start + TABLE_PAGE);
  const canFilter = !!dimKey;

  // Filtering is an explicit control, not a hidden behaviour of the whole row:
  // a row that silently becomes a filter is undiscoverable and fires by
  // accident when someone is selecting text.
  host.innerHTML =
    (sorted.length > TABLE_PAGE
      ? '<div class="logbar"><span class="pageinfo">' + (start + 1) + '–' +
          Math.min(start + TABLE_PAGE, sorted.length) + ' of ' + fmt(sorted.length) +
        '</span><span class="grow"></span>' +
        '<button class="pg" data-d="-1"' + (page === 0 ? " disabled" : "") + '>‹</button>' +
        '<button class="pg" data-d="1"' + (page >= pages - 1 ? " disabled" : "") + '>›</button>' +
        '</div>'
      : "") +
    '<div class="tablewrap"><table><thead><tr>' +
      cols.map(c => '<th data-c="' + c.k + '">' + esc(c.t) +
        (st.col === c.k ? (st.dir < 0 ? " ↓" : " ↑") : "") + '</th>').join("") +
      (canFilter ? '<th class="actcol"></th>' : "") + '</tr></thead><tbody>' +
      slice.map(r => {
        const on = canFilter && (state.sel[dimKey] || []).includes(String(r.value));
        return '<tr' + (on ? ' class="rowon"' : '') + '>' +
          cols.map(c => '<td class="' + (c.dim ? "dim" : "") + '">' +
            (c.f ? c.f(r[c.k], r) : fmt(r[c.k])) + '</td>').join("") +
          (canFilter ? '<td class="actcol"><button class="rowfilter' + (on ? " on" : "") +
            '" data-v="' + esc(String(r.value)) + '">' +
            (on ? "✓ filtered" : "filter") + '</button></td>' : "") + '</tr>';
      }).join("") + '</tbody></table></div>' +
    (pages > 1
      ? '<div class="pager"><button class="pgbtn" data-d="-1"' +
          (page === 0 ? " disabled" : "") + '>← Prev</button>' +
        '<span class="pgnum">Page ' + (page + 1) + ' of ' + pages + '</span>' +
        '<button class="pgbtn" data-d="1"' + (page >= pages - 1 ? " disabled" : "") +
        '>Next →</button></div>'
      : "");

  host.querySelectorAll("th[data-c]").forEach(th => th.addEventListener("click", () => {
    const c = th.dataset.c;
    state.sort = {col: c, dir: st.col === c ? -st.dir : -1};
    _tablePage.set(key, 0);                 // a new sort starts at the first page
    renderTable(host, rows, cols, dimKey);
  }));
  host.querySelectorAll(".pgbtn").forEach(b => b.addEventListener("click", () => {
    if (b.disabled) return;
    _tablePage.set(key, page + (+b.dataset.d));
    renderTable(host, rows, cols, dimKey);
  }));
  host.querySelectorAll(".rowfilter").forEach(bt =>
    bt.addEventListener("click", e => {
      e.stopPropagation(); toggleFilter(dimKey, bt.dataset.v);
    }));
}

/* =======================================================================
   Filters. Progressive narrowing: a click anywhere adds a chip, and every
   card below re-scopes against the same slice.
   ======================================================================= */
function toggleFilter(dim, value) {
  if (!dim) return;
  const arr = state.sel[dim];
  const i = arr.indexOf(value);
  if (i >= 0) arr.splice(i, 1); else arr.push(value);
  refresh();
}
const PRESETS = [
  {id:"full",  label:"Full range"},
  {id:"day",   label:"Peak day"},
  {id:"hour",  label:"Peak hour"},
  {id:"custom",label:"Custom range"},
];
function applyPreset(id) {
  state.preset = id;
  if (!OV) return;
  const [lo, hi] = OV.bounds;
  if (id === "full") { state.from = null; state.to = null; }
  if (id === "day")  { state.from = shift(hi, -24*3600); state.to = hi; }
  if (id === "hour") { state.from = shift(hi, -3600);     state.to = hi; }
}
function shift(ts, secs) {
  const d = new Date(ts.replace(" ", "T") + "Z");
  return new Date(d.getTime() + secs*1000).toISOString().slice(0,19).replace("T"," ");
}
function menu(host, cap, current, rows, onPick, footer) {
  host.innerHTML = `<button><span class="cap">${esc(cap)}</span>${esc(current)}</button>
    <div class="menu" hidden></div>`;
  const btn = host.querySelector("button"), m = host.querySelector(".menu");
  m.innerHTML = rows.map(r => `<button class="row" data-v="${esc(String(r.value))}">
      <span class="tick">${r.on?"✓":""}</span><span>${esc(r.label)}</span>
      ${r.n!=null?`<span class="n">${fmt(r.n)}</span>`:""}</button>`).join("")
    + (footer ? `<div class="sep"></div><div class="foot">${footer}</div>` : "");
  btn.addEventListener("click", e => {
    e.stopPropagation();
    const wasOpen = !m.hidden;
    if (openMenu) openMenu.hidden = true;
    m.hidden = wasOpen; openMenu = wasOpen ? null : m;
  });
  m.addEventListener("click", e => {
    e.stopPropagation();
    const r = e.target.closest(".row");
    if (r) onPick(r.dataset.v);
  });
  return m;
}
document.addEventListener("click", () => { if (openMenu) { openMenu.hidden = true; openMenu = null; } });

/* =========================================================================
   Filter builder.
   Four separate dropdowns made every dimension look independent and hid the
   fact that they compose. This is one entry point that shows the whole
   predicate being built, because combining columns is precisely what the
   storage engine underneath is good at -- LowCardinality dimensions in the
   sort key mean an AND across four of them prunes granules rather than
   scanning and discarding.
   ========================================================================= */
let _fpOpen = false;
let _fpSearch = {};

function activeFilterCount() {
  let n = 0;
  const allowed = new Set((OV && OV.view_dims && OV.view_dims[state.tab]) || []);
  for (const d of DIMS) if (allowed.has(d.key)) n += (state.sel[d.key] || []).length;
  return n;
}

/* The predicate the current selection produces. Shown to the reader because a
   filter UI that hides what it is asking for cannot be debugged -- and because
   it makes the multi-column AND explicit, which is the thing the storage
   engine underneath is actually good at. */
function predicatePreview() {
  const allowed = new Set((OV && OV.view_dims && OV.view_dims[state.tab]) || []);
  const parts = [];
  for (const d of DIMS) {
    if (!allowed.has(d.key)) continue;
    const v = state.sel[d.key] || [];
    if (!v.length) continue;
    parts.push(v.length === 1
      ? d.key + " = '" + v[0] + "'"
      : d.key + " IN (" + v.map(x => "'" + x + "'").join(", ") + ")");
  }
  return parts.length ? parts.join("\n  AND ") : "no predicate — full range";
}

/* Every figure on a page is scoped to a window, and a dashboard that does not
   say which window is asking to be misread. States the RESOLVED range, not the
   preset name: "Peak day" means nothing to someone reading a screenshot. */
function renderRange() {
  const el = $("#rangeout");
  if (!el || !OV) return;
  // On Replay the chart spans what has been ingested so far, so the toolbar
  // must show that span rather than a preset it does not govern.
  if (state.tab === "replay") {
    const s = window._replaySpan;
    el.innerHTML = s
      ? '<b>' + esc(s.from) + '</b> → <b>' + esc(s.to) +
        '</b> UTC <span class="dur">ingested</span>'
      : '<span class="dur">waiting for events</span>';
    return;
  }
  const from = state.from || OV.bounds[0];
  const to   = state.to   || OV.bounds[1];
  const a = new Date(String(from).replace(" ", "T") + "Z");
  const b = new Date(String(to).replace(" ", "T") + "Z");
  if (isNaN(a) || isNaN(b)) { el.textContent = ""; return; }
  const mins = Math.max(0, Math.round((b - a) / 60000));
  const dur = mins >= 1440 ? (mins / 1440).toFixed(mins % 1440 ? 1 : 0) + "d"
            : mins >= 60   ? (mins / 60).toFixed(mins % 60 ? 1 : 0) + "h"
            : mins + "m";
  const f = d => d.toISOString().slice(0, 16).replace("T", " ");
  el.innerHTML = "<b>" + esc(f(a)) + "</b> → <b>" + esc(f(b)) +
    "</b> UTC <span class='dur'>" + esc(dur) + "</span>";
}

function renderFilterPanel() {
  const host = $("#ctl-filters");
  if (!host) return;
  const allowed = (OV && OV.view_dims && OV.view_dims[state.tab]) || [];
  if (!allowed.length) { host.innerHTML = ""; host.hidden = true; return; }
  host.hidden = false;
  const n = activeFilterCount();

  const cols = allowed.map(key => {
    const d = DIMS.find(x => x.key === key);
    if (!d) return "";
    const vals = (FACETS && FACETS[key]) || [];
    const sel = state.sel[key] || [];
    const q = (_fpSearch[key] || "").toLowerCase();
    const shown = q ? vals.filter(v => v.value.toLowerCase().includes(q)) : vals;
    const rows = shown.slice(0, 200).map(v =>
      '<button class="frow" data-dim="' + key + '" data-val="' + esc(v.value) + '">' +
        '<span class="box' + (sel.includes(v.value) ? " on" : "") + '"></span>' +
        '<span class="lbl">' + esc(v.value) + '</span>' +
        '<span class="n">' + fmt(v.sessions) + '</span></button>').join("");
    return '<div class="fcol"><div class="fhead">' + esc(d.label) +
      (sel.length ? '<span class="badge">' + sel.length + '</span>' : "") + '</div>' +
      (vals.length > 8
        ? '<input class="fsearch" data-dim="' + key + '" placeholder="Search…" value="' +
          esc(_fpSearch[key] || "") + '">' : "") +
      '<div class="flist">' + (rows || '<div class="empty">no values yet</div>') + '</div>' +
      (shown.length > 200 ? '<div class="fmore">first 200 of ' + fmt(shown.length) + '</div>' : "") +
      '</div>';
  }).join("");

  host.innerHTML =
    '<button id="fbtn" class="' + (n ? "on" : "") + '">' +
      '<span class="fico">☷</span><span>Filters</span>' +
      (n ? '<span class="badge">' + n + '</span>' : "") +
      '<span class="caret">▾</span></button>' +
    '<div class="fpanel" ' + (_fpOpen ? "" : "hidden") + '>' +
      '<div class="fgrid">' + cols + '</div>' +
      '<div class="fpred"><div class="fpred-h">WHERE</div><pre>' +
        esc(predicatePreview()) + '</pre></div>' +
      '<div class="ffoot"><button class="linkish" id="fclear">Clear all</button>' +
        '<span class="grow"></span>' +
        '<button class="fdone" id="fdone">Done</button></div>' +
    '</div>';

  $("#fbtn").addEventListener("click", e => {
    e.stopPropagation(); _fpOpen = !_fpOpen; renderFilterPanel();
  });
  const panel = host.querySelector(".fpanel");
  if (!panel) return;
  panel.addEventListener("click", e => e.stopPropagation());
  panel.querySelectorAll(".frow").forEach(b =>
    b.addEventListener("click", () => toggleFilter(b.dataset.dim, b.dataset.val)));
  panel.querySelectorAll(".fsearch").forEach(inp =>
    inp.addEventListener("input", () => {
      _fpSearch[inp.dataset.dim] = inp.value;
      renderFilterPanel();
      const again = document.querySelector('.fsearch[data-dim="' + inp.dataset.dim + '"]');
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    }));
  const fc = panel.querySelector("#fclear");
  if (fc) fc.addEventListener("click", () => {
    for (const d of DIMS) state.sel[d.key] = [];
    refresh();
  });
  const fd = panel.querySelector("#fdone");
  if (fd) fd.addEventListener("click", () => { _fpOpen = false; renderFilterPanel(); });
}
document.addEventListener("click", () => {
  if (_fpOpen) { _fpOpen = false; renderFilterPanel(); }
});

function renderFilters() {
  const allowed = new Set((OV && OV.view_dims && OV.view_dims[state.tab]) || []);
  renderTimeControl();
  renderRange();
  renderFilterPanel();
  const chips = [];
  for (const d of DIMS) {
    if (!allowed.has(d.key)) continue;
    for (const v of (state.sel[d.key] || []))
      chips.push('<span class="chip"><span class="k">' + esc(d.label) + '</span><b>' +
        esc(v) + '</b><button data-d="' + d.key + '" data-v="' + esc(v) +
        '" aria-label="Remove">×</button></span>');
  }
  $("#chips").innerHTML = chips.join("");
  $("#chips").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => toggleFilter(b.dataset.d, b.dataset.v)));
  $("#clear").hidden = chips.length === 0;
}

function renderTimeControl() {
  // The replay window is set by ingestion, not by a preset.
  if (state.tab === "replay") { $("#ctl-time").innerHTML = ""; $("#ctl-time").hidden = true; return; }
  $("#ctl-time").hidden = false;
  const cur = PRESETS.find(p => p.id === state.preset);
  const m = menu($("#ctl-time"), "Range", cur ? cur.label : "Full range",
    PRESETS.map(p => ({value: p.id, label: p.label, on: p.id === state.preset})),
    v => { if (v !== "custom") { applyPreset(v); refresh(); }
           else { state.preset = "custom"; renderFilters(); } },
    state.preset === "custom"
      ? '<label class="meta">From<input type="datetime-local" id="cf" value="' +
        String(state.from || OV.bounds[0]).replace(" ", "T") + '"></label>' +
        '<label class="meta">To<input type="datetime-local" id="ct" value="' +
        String(state.to || OV.bounds[1]).replace(" ", "T") + '"></label>'
      : "");
  if (state.preset === "custom" && m) {
    const commit = () => {
      const f = m.querySelector("#cf"), t = m.querySelector("#ct");
      if (f && t && f.value && t.value) {
        state.from = f.value.replace("T", " ") + ":00";
        state.to = t.value.replace("T", " ") + ":00";
        refresh();
      }
    };
    m.querySelectorAll("input").forEach(i => i.addEventListener("change", commit));
  }
}

$("#clear").addEventListener("click", () => {
  for (const d of DIMS) state.sel[d.key] = [];
  refresh();
});

/* =======================================================================
   Dashboards
   ======================================================================= */
function tile(label, value, note, cls) {
  return `<div class="card col-3"><div class="tile">
    <div class="label">${esc(label)}</div>
    <div class="value ${cls || ""}">${value}</div>
    <div class="note">${note || ""}</div></div></div>`;
}

/* A card's rationale belongs behind an affordance. Printing the reasoning at
   full weight beside the data is what makes a dashboard read as documentation
   rather than a product -- so `why` becomes an info popover, not a paragraph. */
let _infoSeq = 0;
function card(title, why, body, col) {
  const id = "i" + (++_infoSeq);
  const info = why ? `<span class="info">
      <button data-info="${id}" aria-label="Why this matters">i</button>
      <div class="pop" id="${id}" hidden>${why}</div></span>` : "";
  return `<div class="card ${col || "col-6"}">
    <header><h2>${esc(title)}</h2>${info}</header>
    <div class="body">${body}</div></div>`;
}

function wireInfo(root) {
  (root || document).querySelectorAll("[data-info]").forEach(b =>
    b.addEventListener("click", e => {
      e.stopPropagation();
      const pop = document.getElementById(b.dataset.info);
      document.querySelectorAll(".info .pop").forEach(p => { if (p !== pop) p.hidden = true; });
      pop.hidden = !pop.hidden;
    }));
}
document.addEventListener("click", () =>
  document.querySelectorAll(".info .pop").forEach(p => p.hidden = true));

function skeleton(rows) {
  return `<div>${Array.from({length: rows || 4},
    () => `<div class="skel skel-line"></div>`).join("")}</div>`;
}
